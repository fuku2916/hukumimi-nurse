          <div style={{marginBottom:12,border:'2px solid #185FA5',borderRadius:14,overflow:'hidden'}}>
            <div style={{padding:'14px 20px',background:'#EBF4FF',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:22}}>🗂️</span>
              <div style={{textAlign:'left',flex:1}}>
                <div style={{fontWeight:700,fontSize:14,color:'#185FA5'}}>管理者モード</div>
                <div style={{fontSize:11,color:'#64748B',marginTop:1}}>シフト管理・AI生成・設定</div>
              </div>
            </div>
            <div style={{padding:'12px 16px',background:'#F8FBFF'}}>
              {hasAdminPin?(
                <>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <input type="password" inputMode="numeric" maxLength={4}
                      value={adminPinInput}
                      onChange={e=>{setAdminPinErr('');setAdminPinInput(e.target.value.replace(/[^0-9]/g,'').slice(0,4));}}
                      onKeyDown={e=>{if(e.key==='Enter'&&adminPinInput.length===4){if(adminPinInput===adminPin){setAppMode('admin');setAdminPinInput('');}else setAdminPinErr('PINが違います');}}}
                      placeholder="管理者PIN（4桁）"
                      style={{width:'100%',padding:'12px',border:'1.5px solid '+(adminPinErr?'#EF4444':'#93C5FD'),borderRadius:8,fontSize:22,textAlign:'center',letterSpacing:'0.4em',fontWeight:700,boxSizing:'border-box'}}/>
                    <button
                      onClick={()=>{if(adminPinInput===adminPin){setAppMode('admin');setAdminPinInput('');}else setAdminPinErr('PINが違います');}}
                      disabled={adminPinInput.length!==4}
                      style={{width:'100%',padding:'12px',border:'none',borderRadius:8,background:adminPinInput.length===4?'#185FA5':'#CBD5E1',color:'#fff',cursor:adminPinInput.length===4?'pointer':'not-allowed',fontSize:16,fontWeight:700}}>
                      入室
                    </button>
                  </div>
                </>
              ):(
                <>
                  <div style={{fontSize:12,color:'#C2410C',marginBottom:8}}>⚠ 管理者PINが未設定です</div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    <input type="password" inputMode="numeric" maxLength={4}
                      value={adminPinInput}
                      onChange={e=>{setAdminPinErr('');setAdminPinInput(e.target.value.replace(/[^0-9]/g,'').slice(0,4));}}
                      placeholder="新しいPIN（4桁）"
                      style={{width:'100%',padding:'12px',border:'1.5px solid #93C5FD',borderRadius:8,fontSize:22,textAlign:'center',letterSpacing:'0.4em',fontWeight:700,boxSizing:'border-box'}}/>
                    <button
                      onClick={()=>{if(adminPinInput.length===4){saveAdminPin(adminPinInput);setAdminPin(adminPinInput);setAdminPinInput('');setAppMode('admin');}}}
                      disabled={adminPinInput.length!==4}
                      style={{width:'100%',padding:'12px',border:'none',borderRadius:8,background:adminPinInput.length===4?'#185FA5':'#CBD5E1',color:'#fff',cursor:adminPinInput.length===4?'pointer':'not-allowed',fontSize:16,fontWeight:700}}>
                      設定して入室
                    </button>
                  </div>
                  <div style={{fontSize:11,color:'#64748B',marginTop:5}}>4桁の数字で管理者PINを設定してください</div>
                </>
              )}
            </div>
          </div>

          {/* スタッフモード */}
          <button onClick={()=>setAppMode('staff_login')}
            style={{width:'100%',padding:'18px 20px',border:'2px solid #7C3AED',borderRadius:14,background:'#F5F3FF',color:'#7C3AED',cursor:'pointer',fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:12,textAlign:'left'}}>
            <span style={{fontSize:22}}>👤</span>
            <div>
              <div>スタッフモード</div>
              <div style={{fontSize:11,fontWeight:400,color:'#64748B',marginTop:1}}>シフト確認・有給・希望休申請</div>
            </div>
          </button>
        </div>
      </div>
    );
  }

  // ── スタッフログイン画面 ──
  if(appMode==='staff_login'){
    return(
      <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#F5F3FF 0%,#EBF4FF 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
        {pinTarget&&(
          <PinDialog staffName={staff.find(s=>s.id===pinTarget.staffId)?.name||''}
            onSuccess={pin=>handleLoginPin(pinTarget.staffId,pin)}
            onCancel={()=>setPinTarget(null)}/>
        )}
        <div style={{background:'#fff',borderRadius:16,padding:28,width:'100%',maxWidth:380,boxShadow:'0 4px 24px rgba(0,0,0,0.10)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
            <button onClick={()=>setAppMode('select')} style={{border:'none',background:'none',cursor:'pointer',fontSize:20,color:'#64748B',padding:0}}>←</button>
            <div>
              <div style={{fontWeight:700,fontSize:16}}>スタッフモード</div>
              <div style={{fontSize:12,color:'#64748B'}}>自分の名前を選んでください</div>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {staff.map(s=>(
              <button key={s.id}
                onClick={()=>{
                  if(!s.pin||s.pin.length!==4){alert(s.name+'の暗証番号が設定されていません。\n管理者に設定を依頼してください。');return;}
                  setPinTarget({staffId:s.id});
                }}
                style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px',
                  border:'2px solid '+s.color,borderRadius:12,background:'#fff',cursor:'pointer',textAlign:'left'}}>
                <span style={{width:10,height:10,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                <span style={{fontWeight:600,fontSize:14,flex:1}}>{s.name}</span>
                {s.pin?.length===4
                  ?<span style={{fontSize:11,color:'#64748B'}}>🔐</span>
                  :<span style={{fontSize:10,color:'#991B1B',background:'#FEF2F2',borderRadius:6,padding:'1px 5px'}}>PIN未設定</span>}
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── スタッフメイン画面 ──
  if(appMode==='staff'){
    const selReq=staffReqDk?requests[staffReqDk]?.[staffMyId]:null;
    const selMySlots=staffReqDk?getStaffSlots(staffMyId,staffReqDk):[];
    return(
      <div style={{background:'#F1F5F9',minHeight:'100vh'}}>
        {/* PINダイアログ */}
        {(pinTarget?.mode==='request'||pinTarget?.mode==='work_wish')&&(
          <PinDialog staffName={staffMe?.name||''} onSuccess={handleRequestPin} onCancel={()=>setPinTarget(null)}/>
        )}
        {pinTarget?.mode==='cancel'&&(
          <PinDialog staffName={staffMe?.name||''} onSuccess={handleCancelPin} onCancel={()=>setPinTarget(null)}/>
        )}
        {/* 申請ボトムシート */}
        {staffReqDk&&(
          <RequestSheet dk={staffReqDk} mySlots={selMySlots}
            allDaySlots={(slots[new Date(staffReqDk).getDay()]||[])}
            selReq={selReq} remainDays={staffRemain}
            workType={staffMe?.workType||'normal'}
            onApply={type=>{setPinTarget({mode:'request',dk:staffReqDk,type});setStaffReqDk(null);}}
            onApplyWorkWish={slotIds=>{setPinTarget({mode:'work_wish',dk:staffReqDk,slotIds});setStaffReqDk(null);}}
            onCancel={()=>setStaffReqDk(null)}
            onCancelReq={()=>{setPinTarget({mode:'cancel',dk:staffReqDk});setStaffReqDk(null);}}/>
        )}
        {/* ヘッダー＋タブ統合 */}
        <div style={{background:'#fff',borderBottom:'1px solid #E2E8F0',display:'flex',alignItems:'center',paddingLeft:14}}>
          {/* 名前 */}
          <span style={{width:9,height:9,borderRadius:'50%',background:staffMe?.color||'#7C3AED',flexShrink:0,marginRight:6}}/>
          <span style={{fontWeight:700,fontSize:14,marginRight:16,whiteSpace:'nowrap'}}>{staffMe?.name}</span>
          {/* タブ */}
          {[{id:'shift',label:'📅 シフト表'},{id:'requests',label:'📋 申請一覧'+(staffReqCount>0?' ('+staffReqCount+')':'')}].map(t=>(
            <button key={t.id} onClick={()=>setStaffTab(t.id)}
              style={{padding:'12px 14px',border:'none',background:'none',cursor:'pointer',fontSize:13,
                fontWeight:staffTab===t.id?600:400,color:staffTab===t.id?'#185FA5':'#64748B',
                borderBottom:staffTab===t.id?'2px solid #185FA5':'2px solid transparent',whiteSpace:'nowrap'}}>
              {t.label}
            </button>
          ))}
          {/* 有給残・ホーム */}
          <div style={{display:'flex',alignItems:'center',gap:8,marginLeft:'auto',paddingRight:14,flexShrink:0}}>
            <div style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',borderRadius:8,background:'#FDF2F8',border:'1px solid #F9A8D4'}}>
              <span style={{fontSize:12,color:'#86198F',fontWeight:600}}>🌸 有給残</span>
              <span style={{fontSize:15,fontWeight:700,color:staffRemain<=3?'#DC2626':'#86198F'}}>{staffRemain}</span>
              <span style={{fontSize:12,color:'#86198F'}}>日</span>
            </div>
            <button onClick={()=>{setAppMode('select');setStaffMyId(null);setStaffReqDk(null);setStaffTab('shift');}}
              style={{padding:'6px 14px',border:'1px solid #CBD5E1',borderRadius:8,background:'#F8FAFC',color:'#64748B',cursor:'pointer',fontSize:12,whiteSpace:'nowrap'}}>
              🏠 ホーム
            </button>
          </div>
        </div>
        {/* シフト表タブ */}
        {staffTab==='shift'&&(
          <div style={{padding:0}}>
            {/* 月ナビ */}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 8px'}}>
              <button onClick={()=>{if(staffM===1){setStaffY(v=>v-1);setStaffM(12);}else setStaffM(v=>v-1);setStaffReqDk(null);}} style={{border:'1px solid #CBD5E1',borderRadius:8,padding:'4px 10px',background:'#fff',cursor:'pointer',fontSize:14}}>◀</button>
              <span style={{fontWeight:700,fontSize:15}}>{staffY}年 {staffM}月</span>
              <button onClick={()=>{if(staffM===12){setStaffY(v=>v+1);setStaffM(1);}else setStaffM(v=>v+1);setStaffReqDk(null);}} style={{border:'1px solid #CBD5E1',borderRadius:8,padding:'4px 10px',background:'#fff',cursor:'pointer',fontSize:14}}>▶</button>
              <span style={{fontSize:11,color:'#64748B'}}>自分の行をタップ→申請</span>
            </div>
            <div style={{overflowX:'auto',borderRadius:12,border:'1px solid #E2E8F0',background:'#fff'}}>
              <table style={{borderCollapse:'collapse',fontSize:13,minWidth:'max-content'}}>
                <thead>
                  <tr style={{background:'#F8FAFC'}}>
                    <th style={{padding:'10px 14px',border:'1px solid #E2E8F0',textAlign:'left',fontSize:13,fontWeight:600,minWidth:80,position:'sticky',left:0,background:'#F8FAFC',zIndex:2}}>スタッフ</th>
                    {staffDates.map(d=>{
                      const dk=tdk(d),isSat=d.getDay()===6,isClosed=staffIsClosedDay(dk),holName=staffHolidays[dk];
                      return(
                        <th key={dk} style={{padding:'8px 5px',border:'1px solid #E2E8F0',textAlign:'center',fontSize:12,fontWeight:600,minWidth:52,
                          background:isClosed?'#FEF2F2':isSat?'#FFFBEB':'#F8FAFC',
                          color:holName?'#991B1B':isSat?'#92400E':'#64748B'}}>
                          <div style={{fontSize:14,fontWeight:700}}>{d.getDate()}</div>
                          <div style={{fontSize:11,fontWeight:400}}>{DAY_JP[d.getDay()]}</div>
                          {holName&&<div style={{fontSize:10,color:'#991B1B',lineHeight:1.2}}>{holName.slice(0,3)}</div>}
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {staff.map(s=>{
                    const isMe=s.id===staffMyId;
                    return(
                      <tr key={s.id} style={{background:isMe?'#FAFEFF':''}}>
                        <td style={{padding:'8px 12px',border:'1px solid #E2E8F0',whiteSpace:'nowrap',
                          position:'sticky',left:0,zIndex:1,
                          background:isMe?'#EBF4FF':'#FAFAFA',
                          borderLeft:isMe?'3px solid '+s.color:'1px solid #E2E8F0'}}>
                          <div style={{display:'flex',alignItems:'center',gap:5}}>
                            <span style={{width:7,height:7,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                            <span style={{fontSize:13,fontWeight:isMe?700:400,color:isMe?'#185FA5':'#1E293B'}}>{s.name}</span>
                            {isMe&&<span style={{fontSize:10,color:'#185FA5',background:'#EBF4FF',borderRadius:4,padding:'1px 5px'}}>自分</span>}
                          </div>
                        </td>
                        {staffDates.map(d=>{
                          const dk=tdk(d),isClosed=staffIsClosedDay(dk),isSat=d.getDay()===6;
                          const sSlots=getStaffSlots(s.id,dk);
                          const req=isMe?requests[dk]?.[staffMyId]:null;
                          const rt=req?REQ_TYPES[req.type]:null;
                          const tmpCond=tmps[dk]?.[String(s.id)];
                          const isOffTmp=['off','paid','paid_am','paid_pm'].includes(tmpCond?.type);
                          const _si=(!isClosed&&!req&&!isOffTmp)?getShortageInfo(dk,slots,asgn,tmps,weeklyReq):'ok';
                          const cellBg=isClosed?'#FEF2F2':req?rt.bg:isOffTmp?'#FFF7ED':isSat?'#FFFBEB':'';
                          const _badge=_si==='empty'?'❌':_si==='shortage'?'⚠️':null;
                          return(
                            <td key={dk}
                              onClick={()=>{if(isMe&&!isClosed)setStaffReqDk(dk);}}
                              style={{padding:'6px 4px',border:'1px solid #E2E8F0',textAlign:'center',position:'relative',verticalAlign:'middle',
                                background:cellBg,cursor:isMe&&!isClosed?'pointer':'default',minWidth:52,maxWidth:68}}>
                              {_badge&&<div style={{position:'absolute',top:1,right:1,fontSize:10,lineHeight:1,pointerEvents:'none'}}>{_badge}</div>}
                              {isClosed?<span style={{fontSize:11,color:'#999'}}>—</span>
                              :req?<div style={{fontSize:12,fontWeight:700,color:rt.color,lineHeight:1.4}}>{rt.icon} {rt.short}{req.type==='work_wish'&&req.slotLabels&&<div style={{fontSize:9,fontWeight:400}}>{req.slotLabels.slice(0,2).join('/')}</div>}</div>
                              :isOffTmp?<div style={{fontSize:11,color:'#C2410C'}}>休み</div>
                              :sSlots.length>0?(
                                <div style={{display:'flex',flexDirection:'column',gap:1,alignItems:'center'}}>
                                  {(()=>{const t=getStaffTimeStr(sSlots,s.notes);return t.startStr?<div style={{fontSize:10,color:'#1D6FCC',fontWeight:700,textAlign:'right',width:'100%',paddingRight:2}}>{t.startStr}</div>:null;})()}
                                  {sSlots.map(slot=>{
                                    const sc=getTimeColor(slot);
                                    return<div key={slot.id} style={{fontSize:11,padding:'2px 5px',borderRadius:3,background:sc.bg,color:sc.text,fontWeight:700,lineHeight:1.4,whiteSpace:'nowrap',maxWidth:62,overflow:'hidden',textOverflow:'ellipsis',borderLeft:'3px solid '+sc.border}}>{slot.label}</div>;
                                  })}
                                  {(()=>{const t=getStaffTimeStr(sSlots,s.notes);return t.endStr?<div style={{fontSize:10,color:'#991B1B',fontWeight:700,textAlign:'right',width:'100%',paddingRight:2}}>{t.endStr}</div>:null;})()}
                                </div>
                              ):<span style={{fontSize:11,color:'#CBD5E1'}}>—</span>}
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{fontSize:16,color:'#64748B',marginTop:10,paddingLeft:4}}>※ <strong style={{color:'#185FA5'}}>自分の行</strong>をタップすると申請できます</div>
          </div>
        )}
        {/* 申請一覧タブ */}
        {staffTab==='requests'&&(
          <div style={{padding:14,maxWidth:540}}>
            <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:12,padding:14,marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>申請一覧</div>
              {(()=>{
                const myList=[];
                Object.entries(requests).forEach(([dk,dayMap])=>{if(dayMap[String(staffMyId)])myList.push({dk,req:dayMap[String(staffMyId)]});});
                myList.sort((a,b)=>a.dk>b.dk?1:-1);
                if(myList.length===0)return(
                  <div style={{textAlign:'center',padding:'24px 0',color:'#64748B',fontSize:13}}>
                    <div style={{fontSize:24,marginBottom:6}}>📋</div>
                    <div>申請はまだありません</div>
                    <div style={{fontSize:11,marginTop:3}}>シフト表の自分の行をタップして申請できます</div>
                  </div>
                );
                return(
                  <div style={{display:'flex',flexDirection:'column',gap:7}}>
                    {myList.map(({dk,req})=>{
                      const d=new Date(dk),rt=REQ_TYPES[req.type]||{icon:'📋',label:req.type,color:'#374151',bg:'#F8FAFC',border:'#CBD5E1'};
                      return(
                        <div key={dk} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:rt.bg,border:'1px solid '+rt.border,borderRadius:8}}>
                          <div style={{flex:1}}>
                            <div style={{fontWeight:700,fontSize:12,color:rt.color}}>{rt.icon} {d.getMonth()+1}/{d.getDate()}({DAY_JP[d.getDay()]})</div>
                            <div style={{fontSize:11,color:'#64748B',marginTop:1}}>{rt.label}</div>
                          </div>
                          <button onClick={()=>setStaffReqDk(dk)} style={{padding:'4px 9px',border:'1px solid #E2E8F0',borderRadius:8,background:'#fff',color:'#64748B',cursor:'pointer',fontSize:11}}>詳細</button>
                        </div>
                      );
                    })}
                  </div>
                );
              })()}
            </div>
            <div style={{background:'#EBF4FF',border:'1px solid #93C5FD',borderRadius:12,padding:12}}>
              <div style={{fontWeight:600,fontSize:12,color:'#185FA5',marginBottom:6}}>✅ 申請は自動で管理者に反映されます</div>
              <div style={{fontSize:11,color:'#1E3A5F',lineHeight:1.8}}>申請した内容は即座に保存され、管理者がシフト管理画面を開くと自動的に読み込まれます。紙への記入やファイルの受け渡しは不要です。</div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div style={{background:K.bgT,minHeight:'100vh',overflowX:'hidden'}}>
      {/* ── メニューバー ── */}
      <div style={{background:K.bg,borderBottom:K.bd,userSelect:'none'}}
        onClick={e=>{if(e.target===e.currentTarget)setOpenMenu(null);}}>
        <div style={{display:'flex',alignItems:'center',padding:'0 10px',height:50}}>
          {/* ロゴ・ホーム */}
          <button onClick={()=>{setAppMode('select');setAdminPinInput('');setAdminPinErr('');setOpenMenu(null);}}
            style={{display:'flex',alignItems:'center',gap:4,padding:'4px 8px',border:'none',background:'none',cursor:'pointer',marginRight:6,flexShrink:0}}>
            <span style={{fontSize:20}}>🏥</span>
            <span style={{fontWeight:700,fontSize:'var(--fs-menu)',color:K.text,whiteSpace:'nowrap'}}>福耳会</span>
          </button>

          {/* スタッフ申請バッジ */}
          {(()=>{const n=Object.values(requests).filter(d=>Object.keys(d).length>0).length;return n>0?<span onClick={()=>{setTab('paid');setOpenMenu(null);}} style={{fontSize:13,background:'#FDF2F8',color:'#86198F',border:'1px solid #F9A8D4',borderRadius:10,padding:'2px 8px',fontWeight:600,whiteSpace:'nowrap',cursor:'pointer',marginRight:6,flexShrink:0}}>🌸 {n}件</span>:null;})()}

          {/* PC：メニュー項目 / スマホ：ハンバーガー */}
          <div className="pc-menu" style={{display:'flex',alignItems:'center',flex:1}}>
            {[
              {id:'file',    label:'ファイル'},
              {id:'settings',label:'設定'},
              {id:'design',  label:'シフト設計'},
              {id:'output',  label:'出力'},
            ].map(menu=>(
              <div key={menu.id} style={{position:'relative'}}>
                <button
                  onClick={e=>{e.stopPropagation();setOpenMenu(openMenu===menu.id?null:menu.id);}}
                  style={{padding:'4px 10px',border:'none',background:openMenu===menu.id?K.bgI:'none',
                    color:openMenu===menu.id?K.textI:K.text,cursor:'pointer',fontSize:'var(--fs-menu)',fontWeight:openMenu===menu.id?600:400,
                    borderRadius:6,height:32,whiteSpace:'nowrap'}}>
                  {menu.label}
                </button>
              {openMenu===menu.id&&(
                <div onClick={e=>e.stopPropagation()}
                  style={{position:'absolute',top:38,left:0,background:K.bg,border:K.bd,borderRadius:K.rlg,
                    boxShadow:'0 8px 24px rgba(0,0,0,0.12)',zIndex:999,minWidth:180,padding:'6px 0',overflow:'hidden'}}>

                  {/* ファイルメニュー */}
                  {menu.id==='file'&&<>
                    <MenuItem icon="💾" label="全データ保存" onClick={()=>{saveData();setOpenMenu(null);}}/>
                    <MenuItem icon="📂" label="全データ読み込み" isFile accept=".json" onChange={e=>{loadData(e);setOpenMenu(null);}}/>
                    <MenuDivider/>
                    <MenuLabel text="危険操作"/>
                    <MenuItem icon="⚠️" label="初期化..." danger onClick={()=>{
                      setOpenMenu(null);
                      const choice=window.prompt('【リセットの種類】\n1 → 今月シフトのみ\n2 → 全月シフト\n3 → 完全リセット\n番号を入力:');
                      if(choice==='1'){if(window.confirm('今月のシフトをリセットします。よろしいですか？')){setAsgn(p=>{const n={...p};dates.forEach(d=>{delete n[tdk(d)];});return n;});setTmps(p=>{const n={...p};dates.forEach(d=>{delete n[tdk(d)];});return n;});setManualExclusions(p=>{const n={...p};dates.forEach(d=>{delete n[tdk(d)];});return n;});setARes(null);setApid(null);}}
                      else if(choice==='2'){if(window.confirm('全月シフトをリセットします。')){setAsgn({});setTmps({});setManualExclusions({});setARes(null);setApid(null);}}
                      else if(choice==='3'){if(window.confirm('【警告】全データを消去します。元に戻せません。')){localStorage.removeItem(LS_KEY);window.location.reload();}}
                    }}/>
                  </>}

                  {/* 設定メニュー */}

                          const filtered=(cur.history||[]).filter(r=>r.dk!==dk);

// ================================================================
// 当月のA/Bパターン割当プレビュー
// ================================================================
function CurrentMonthPatternPreview({y,m}){
  // 当月の各週の月曜日を取得し、A/Bを表示
  function getABPattern(d){
    const year=d.getFullYear();
    const jan1=new Date(year,0,1);
    const dayOfWeek=jan1.getDay();
    const daysToMonday=dayOfWeek===0?-6:(1-dayOfWeek);
    const firstMon=new Date(jan1);
    firstMon.setDate(jan1.getDate()+daysToMonday);
    const diffDays=Math.floor((d-firstMon)/(1000*60*60*24));
    const weekIdx=Math.floor(diffDays/7);
    return weekIdx%2===0?'A':'B';
  }
  const dates=[];
  const d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){
    if(d.getDay()===1) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  // 月の最初の週も拾う（月初が月曜以外の場合）
  if(dates.length===0||dates[0].getDate()>1){
    dates.unshift(new Date(y,m-1,1));
  }

  return(
    <div style={{background:K.bgS,border:K.bd,borderRadius:K.rmd,padding:'8px 12px',marginBottom:12,display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
      <span style={{fontSize:11,fontWeight:600,color:K.textS}}>{y}年{m}月の割当:</span>
      {dates.map((wkStart,i)=>{
        const pat=getABPattern(wkStart);
        const wkEnd=new Date(wkStart);wkEnd.setDate(wkStart.getDate()+5);
        if(wkEnd.getMonth()!==m-1){wkEnd.setMonth(m-1);wkEnd.setDate(new Date(y,m,0).getDate());}
        return(
          <span key={i} style={{fontSize:11,padding:'2px 8px',borderRadius:4,
            background:pat==='A'?'#DBEAFE':'#FCE7F3',
            color:pat==='A'?'#1E40AF':'#9D174D',
            fontWeight:500}}>
            {wkStart.getMonth()+1}/{wkStart.getDate()}〜 = {pat}
          </span>
        );
      })}
    </div>
  );
}

// ベースシフト 人間可読JSON ⇔ 内部構造 変換ヘルパー
// ================================================================
const DOW_NAME_TO_NUM = {
  '月':1,'月曜':1,'月曜日':1,
  '火':2,'火曜':2,'火曜日':2,
  '水':3,'水曜':3,'水曜日':3,
  '木':4,'木曜':4,'木曜日':4,
  '金':5,'金曜':5,'金曜日':5,
  '土':6,'土曜':6,'土曜日':6,
};
const DOW_NUM_TO_NAME = {1:'月',2:'火',3:'水',4:'木',5:'金',6:'土'};

// 人間可読JSON → 内部baseShift構造に変換
function convertHumanReadableToBaseShift(data, staff, slots){
  const result={
    baseShift:{A:{},B:{}},
    assignmentCount:0,
    aCount:0,
    bCount:0,
    warnings:[],
    errors:[],
  };

  // 既に内部構造形式（A: {1: {am_out: [1,2]}}）の場合はそのまま使用
  function isInternalFormat(d){
    if(!d||typeof d!=='object')return false;
    const a=d.A||d.baseShift?.A;
    if(!a||typeof a!=='object')return false;
    // キーが数値の文字列なら内部形式
    return Object.keys(a).some(k=>/^[1-6]$/.test(k));
  }

  const source=data.patterns||data.baseShift||data;

  if(isInternalFormat(data)){
    // 既に内部形式の場合は staff.id, slot.id をそのまま使う想定
    ['A','B'].forEach(pat=>{
      const patData=source[pat]||{};
      Object.entries(patData).forEach(([dowKey,slotMap])=>{
        const dow=parseInt(dowKey);
        if(isNaN(dow))return;
        result.baseShift[pat][dow]={};
        Object.entries(slotMap||{}).forEach(([slotId,ids])=>{
          if(Array.isArray(ids)){
            const validIds=ids.filter(id=>staff.some(s=>s.id===id));
            if(validIds.length>0){
              result.baseShift[pat][dow][slotId]=validIds;
              result.assignmentCount+=validIds.length;
              if(pat==='A')result.aCount+=validIds.length;
              else result.bCount+=validIds.length;
            }
          }
        });
      });
    });
    return result;
  }

  // 人間可読フォーマットの処理
  // 期待: data.patterns = { A: { pattern_name: ..., shifts: { 月: { 午前外来: ["北尾","北口"] } } }, B: {...} }
  // または data.A = {...}, data.B = {...}
  // または data = { A: { shifts: {...} }, B: { shifts: {...} } }

  // スタッフ名 → ID マッピング（括弧書きや（前半担当）などのサフィックスを除去）
  function resolveStaffId(nameStr){
    if(typeof nameStr!=='string')return null;
    // 括弧書きを除去：「杉本（前半担当）」「北尾（月1回）」「小田（17:30-18:00のみ）」など
    let cleanName=nameStr.replace(/[（(].*?[）)]/g,'').trim();
    if(!cleanName)return null;
    const match=staff.find(s=>s.name===cleanName);
    if(match)return match.id;
    // 部分一致もトライ
    const partial=staff.find(s=>cleanName.includes(s.name)||s.name.includes(cleanName));
    if(partial){
      result.warnings.push(`スタッフ名「${nameStr}」を「${partial.name}」として解釈しました`);
      return partial.id;
    }
    return null;
  }

  // コマラベル → スロットID マッピング
  function resolveSlotId(label, dow){
    if(typeof label!=='string')return null;
    const slotsForDow=slots[dow]||[];
    // 完全一致
    const exact=slotsForDow.find(sl=>sl.label===label);
    if(exact)return exact.id;
    // IDが直接書かれている場合
    const byId=slotsForDow.find(sl=>sl.id===label);
    if(byId)return byId.id;
    // 部分一致
    const partial=slotsForDow.find(sl=>label.includes(sl.label)||sl.label.includes(label));
    if(partial){
      result.warnings.push(`コマ名「${label}」(${DOW_NUM_TO_NAME[dow]}曜)を「${partial.label}」として解釈しました`);
      return partial.id;
    }
    return null;
  }

  function processPattern(pat, patData){
    if(!patData)return;
    const shifts=patData.shifts||patData;
    result.baseShift[pat]={};
    Object.entries(shifts).forEach(([dowKey,slotMap])=>{
      // dowKeyは「月」「火」など、または数値1-6
      let dow=DOW_NAME_TO_NUM[dowKey];
      if(!dow){
        const n=parseInt(dowKey);
        if(!isNaN(n)&&n>=1&&n<=6)dow=n;
      }
      if(!dow){
        result.warnings.push(`曜日「${dowKey}」を解釈できませんでした`);
        return;
      }
      result.baseShift[pat][dow]={};
      Object.entries(slotMap||{}).forEach(([slotLabel,nameList])=>{
        const slotId=resolveSlotId(slotLabel,dow);
        if(!slotId){
          result.warnings.push(`${DOW_NUM_TO_NAME[dow]}曜の「${slotLabel}」コマが見つかりません`);
          return;
        }
        if(!Array.isArray(nameList)){
          // 「松枝」のような単一文字列にも対応
          if(typeof nameList==='string')nameList=[nameList];
          else return;
        }
        const sids=[];
        nameList.forEach(name=>{
          if(name==='—'||name==='-'||!name)return;
          const sid=resolveStaffId(name);
          if(sid){
            sids.push(sid);
          }else{
            result.warnings.push(`${DOW_NUM_TO_NAME[dow]}曜・${slotLabel}: スタッフ「${name}」が見つかりません`);
          }
        });
        if(sids.length>0){
          result.baseShift[pat][dow][slotId]=sids;
          result.assignmentCount+=sids.length;
          if(pat==='A')result.aCount+=sids.length;
          else result.bCount+=sids.length;
        }
      });
    });
  }

  // パターンの抽出
  const aPat=source.A||source.a||(data.patterns?.A);
  const bPat=source.B||source.b||(data.patterns?.B);
  if(!aPat&&!bPat){
    result.errors.push('AパターンもBパターンも見つかりません。JSONフォーマットを確認してください。');
    return result;
  }
  if(aPat)processPattern('A',aPat);
  if(bPat)processPattern('B',bPat);

  return result;
}

// 内部baseShift構造 → 人間可読JSONに変換
function convertBaseShiftToHumanReadable(baseShift, staff, slots){
  const result={
    version:'CL-2 Human Readable',
    exportedAt:new Date().toISOString(),
    patterns:{A:{shifts:{}},B:{shifts:{}}},
  };
  ['A','B'].forEach(pat=>{
    const patData=baseShift[pat]||{};
    [1,2,3,4,5,6].forEach(dow=>{
      const dayMap=patData[dow]||{};
      const dayName=DOW_NUM_TO_NAME[dow];
      const dayShifts={};
      (slots[dow]||[]).forEach(slot=>{
        const ids=dayMap[slot.id]||[];
        if(ids.length===0)return;
        const names=ids.map(id=>{
          const s=staff.find(x=>x.id===id);
          return s?s.name:`(ID:${id})`;
        });
        dayShifts[slot.label]=names;
      });
      if(Object.keys(dayShifts).length>0){
        result.patterns[pat].shifts[dayName]=dayShifts;
      }
    });
  });
  return result;
}

function BaseShiftTab({staff,slots,baseShift,setBaseShift,setBaseSlotStaff,toggleBaseSlotStaff,applyBaseShiftToMonth,y,m}){
  const [activePattern,setActivePattern]=useState('A');
  const dows=[1,2,3,4,5,6];

  // ── ベースシフトJSON取込 ──
  function handleImportBaseShift(e){
    const file=e.target.files?.[0];
    if(!file){return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        // 取込結果集計用
        const result=convertHumanReadableToBaseShift(data,staff,slots);
        if(result.errors.length>0&&result.assignmentCount===0){
          alert('取込に失敗しました:\n'+result.errors.slice(0,10).join('\n'));
          return;
        }
        // 確認ダイアログ
        let msg=`ベースシフトを取り込みます。\n\n`;
        msg+=`A週: ${result.aCount}コマ配置\n`;
        msg+=`B週: ${result.bCount}コマ配置\n`;
        msg+=`合計: ${result.assignmentCount}コマ\n`;
        if(result.warnings.length>0){
          msg+=`\n警告 (${result.warnings.length}件):\n`+result.warnings.slice(0,5).join('\n');
          if(result.warnings.length>5){msg+=`\n...他${result.warnings.length-5}件`;}
        }
        msg+='\n\n既存のベースシフトは上書きされます。よろしいですか？';
        if(window.confirm(msg)){
          setBaseShift(result.baseShift);
          alert(`ベースシフトを取り込みました（${result.assignmentCount}コマ）`);
        }
      }catch(err){
        alert('取込に失敗しました: '+err.message);
      }
    };
    reader.readAsText(file);
    e.target.value='';
  }

  // ── ベースシフトJSONエクスポート ──
  function handleExportBaseShift(){
    const exportData=convertBaseShiftToHumanReadable(baseShift,staff,slots);
    const json=JSON.stringify(exportData,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`base_shift_${y}${String(m).padStart(2,'0')}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function handleApply(){
    if(window.confirm(`ベースシフトを ${y}年${m}月 に展開します。\nすでに割り当てられている日はスキップされ、空いている日のみベースシフトが適用されます。よろしいですか？`)){
      const count=applyBaseShiftToMonth();
      alert(`${count}日にベースシフトを適用しました。`);
    }
  }

  function handleClear(){
    if(window.confirm(`パターン${activePattern}のベースシフトをすべてクリアしますか？`)){
      dows.forEach(dow=>{
        (slots[dow]||[]).forEach(slot=>{
          setBaseSlotStaff(activePattern,dow,slot.id,[]);
        });
      });
    }
  }

  // パターン間でコピー
  function copyPattern(from,to){
    if(window.confirm(`パターン${from}の内容をパターン${to}にコピーしますか？\nパターン${to}の既存内容は上書きされます。`)){
      const src=baseShift[from]||{};
      dows.forEach(dow=>{
        (slots[dow]||[]).forEach(slot=>{
          const sids=src[dow]?.[slot.id]||[];
          setBaseSlotStaff(to,dow,slot.id,[...sids]);
        });
      });
    }
  }

  return(
    <div style={{padding:16}}>
      {/* ── 説明ガイド ── */}
      <div style={{background:'#EFF6FF',border:'1px solid #BFDBFE',borderRadius:K.rlg,padding:14,marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <span style={{fontSize:14}}>📋</span>
          <span style={{fontWeight:600,fontSize:13,color:'#1E40AF'}}>ベースシフト（2週間定型パターン）</span>
        </div>
        <div style={{fontSize:12,color:'#1E40AF',lineHeight:1.7}}>
          通常の勤務パターンをパターンA・パターンBに分けて設定します。
          <strong>1月1日からの通算週番号で A/B を交互に判定</strong>するため、月をまたいでも同じパターンが連続することはありません。
          <br/>
          各コマのスタッフバッジをクリックすると、ON/OFFを切り替えられます（背景が濃い色＝割り当て中）。
          <br/>
          <span style={{fontWeight:600}}>新しい月を開いたとき、空いている日にベースシフトが自動展開されます。</span>
        </div>
      </div>

      {/* ── 当月のA/B割当プレビュー ── */}
      <CurrentMonthPatternPreview y={y} m={m}/>

      {/* ── JSON取込/書出ボタン ── */}
      <div style={{background:'#FEF3C7',border:'1px solid #FCD34D',borderRadius:K.rlg,padding:12,marginBottom:14}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <span style={{fontSize:14}}>📥</span>
          <span style={{fontWeight:600,fontSize:13,color:'#92400E'}}>ベースシフトJSON取込/書出</span>
        </div>
        <div style={{fontSize:11,color:'#92400E',lineHeight:1.6,marginBottom:8}}>
          スタッフ名・曜日名・コマ名で書かれたわかりやすいJSON形式で、ベースシフトを一括登録/書出できます。
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <label style={{padding:'6px 14px',border:'1px solid #B45309',borderRadius:K.rmd,background:'#fff',color:'#B45309',cursor:'pointer',fontSize:12,fontWeight:600,display:'inline-flex',alignItems:'center',gap:5}}>
            📥 JSON取込
            <input type="file" accept=".json" onChange={handleImportBaseShift} style={{display:'none'}}/>
          </label>
          <button onClick={handleExportBaseShift}
            style={{padding:'6px 14px',border:'1px solid #B45309',borderRadius:K.rmd,background:'#fff',color:'#B45309',cursor:'pointer',fontSize:12,fontWeight:600}}>
            📤 JSON書出
          </button>
          <span style={{fontSize:11,color:'#92400E',alignSelf:'center'}}>
            ※ 取込時は既存のベースシフトを上書きします
          </span>
        </div>
      </div>

      {/* ── 操作ボタン ── */}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14,alignItems:'center'}}>
        <div style={{display:'flex',background:K.bgS,borderRadius:K.rmd,padding:3}}>
          {['A','B'].map(p=>(
            <button key={p} onClick={()=>setActivePattern(p)}
              style={{padding:'6px 18px',border:'none',borderRadius:K.rmd-2,background:activePattern===p?K.bgI:'transparent',color:activePattern===p?K.textI:K.textS,cursor:'pointer',fontSize:13,fontWeight:activePattern===p?600:400}}>
              パターン{p}
            </button>
          ))}
        </div>
        <span style={{fontSize:11,color:K.textS,marginLeft:10}}>
          ※ 1月1日から通算で1週目=A、2週目=B、3週目=A...と交互に適用されます
        </span>
        <div style={{marginLeft:'auto',display:'flex',gap:6}}>
          <button onClick={()=>copyPattern(activePattern,activePattern==='A'?'B':'A')}
            style={{padding:'5px 12px',border:K.bd2,borderRadius:K.rmd,background:K.bg,color:K.text,cursor:'pointer',fontSize:11}}>
            📋 パターン{activePattern==='A'?'B':'A'}にコピー
          </button>
          <button onClick={handleClear}
            style={{padding:'5px 12px',border:K.bdD,borderRadius:K.rmd,background:K.bg,color:K.textD,cursor:'pointer',fontSize:11}}>
            🗑 パターン{activePattern}をクリア
          </button>
          <button onClick={handleApply}
            style={{padding:'5px 14px',border:'none',borderRadius:K.rmd,background:K.bgI,color:'#fff',cursor:'pointer',fontSize:12,fontWeight:600}}>
            ⚡ {y}年{m}月に適用
          </button>
        </div>
      </div>

      {/* ── 編集グリッド ── */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(280px, 1fr))',gap:12}}>
        {dows.map(dow=>{
          const dowName=['','月','火','水','木','金','土'][dow];
          const isSat=dow===6;
          const slotsForDay=slots[dow]||[];
          return(
            <div key={dow} style={{background:K.bg,border:K.bd,borderRadius:K.rlg,padding:12}}>
              <div style={{fontWeight:600,fontSize:14,marginBottom:10,paddingBottom:6,borderBottom:K.bd,color:isSat?'#92400E':K.text}}>
                {dowName}曜
              </div>
              {slotsForDay.length===0?(
                <div style={{fontSize:11,color:K.textS}}>この曜日にはコマがありません</div>
              ):slotsForDay.map(slot=>{
                const sc=getSlotColor(slot);
                const assigned=baseShift[activePattern]?.[dow]?.[slot.id]||[];
                return(
                  <div key={slot.id} style={{marginBottom:10,padding:'8px 10px',borderRadius:K.rmd,borderLeft:'3px solid '+sc.border,background:sc.bgLight}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                      <span style={{fontSize:12,fontWeight:600}}>{slot.label}</span>
                      <span style={{fontSize:10,color:K.textS}}>{slot.time}</span>
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                      {staff.map(s=>{
                        const on=assigned.includes(s.id);
                        return(
                          <button key={s.id} onClick={()=>toggleBaseSlotStaff(activePattern,dow,slot.id,s.id)}
                            style={{
                              padding:'2px 8px',border:'1.5px solid '+s.color,borderRadius:12,fontSize:11,cursor:'pointer',
                              background:on?s.color:'transparent',
                              color:on?'#fff':s.color,
                              fontWeight:on?600:400,
                              userSelect:'none',
                            }}>
                            {s.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ================================================================
// 達成レポートパネル
// ================================================================
function ReportPanel({reports,y,m,onClose,onExportPDF}){
  return(
    <div style={{background:'#fff',border:'2px solid #B45309',borderRadius:12,marginBottom:14,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'#FFFBEB',borderBottom:'1px solid #FCD34D'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontWeight:600,fontSize:14,color:'#B45309'}}>📊 達成レポート</span>
          <span style={{fontSize:11,color:'#92400E'}}>{y}年{m}月 - 各スタッフの勤務条件と実際のシフトの照合</span>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick={onExportPDF} style={{padding:'5px 12px',border:'1px solid #B45309',borderRadius:6,background:'#fff',color:'#B45309',cursor:'pointer',fontSize:11,fontWeight:600}}>🖨 PDFで印刷</button>
          <button onClick={onClose} style={{border:'none',background:'none',cursor:'pointer',fontSize:20,color:'#B45309',lineHeight:1,padding:0}}>×</button>
        </div>
      </div>
      <div style={{padding:14,maxHeight:600,overflowY:'auto'}}>
        {reports.map((r,idx)=>{
          const empBadge=r.employmentType==='fulltime'
            ?<span style={{fontSize:10,background:'#185FA5',color:'#fff',padding:'1px 7px',borderRadius:4,marginLeft:8,fontWeight:600}}>常勤</span>
            :r.employmentType==='parttime'
            ?<span style={{fontSize:10,background:'#64748B',color:'#fff',padding:'1px 7px',borderRadius:4,marginLeft:8,fontWeight:600}}>パート</span>
            :null;
          return(
            <div key={r.staff.id} style={{marginBottom:idx<reports.length-1?16:0,padding:12,border:'1px solid #E2E8F0',borderRadius:8,background:'#FAFAFA'}}>
              {/* ヘッダー */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:6,borderBottom:'1px solid #CBD5E1'}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{width:10,height:10,borderRadius:'50%',background:r.staff.color,flexShrink:0}}/>
                  <span style={{fontSize:14,fontWeight:600}}>{r.staff.name}</span>
                  {empBadge}
                </div>
                <span style={{fontSize:11,color:'#64748B',fontWeight:600}}>月間 {r.totalH.toFixed(1)}h / {r.totalSlots}コマ</span>
              </div>

              {/* 勤務条件 */}
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:'#475569',marginBottom:3}}>▶ 勤務条件</div>
                <div style={{paddingLeft:14,fontSize:11,color:'#1E293B',lineHeight:1.7,whiteSpace:'pre-wrap'}}>
                  {r.staff.notes||<span style={{color:'#94A3B8',fontStyle:'italic'}}>（条件未設定）</span>}
                </div>
              </div>

              {/* 達成した条件 */}
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:'#15803D',marginBottom:3}}>▶ 達成した条件</div>
                <div style={{paddingLeft:14}}>
                  {r.ok.length===0?<span style={{fontSize:11,color:'#94A3B8',fontStyle:'italic'}}>なし</span>:r.ok.map((t,i)=>(
                    <div key={i} style={{fontSize:11,color:'#15803D',marginBottom:2,fontWeight:500}}>○ {t}</div>
                  ))}
                </div>
              </div>

              {/* 達成できなかった条件 */}
              <div>
                <div style={{fontSize:11,fontWeight:700,color:'#B91C1C',marginBottom:3}}>▶ 達成できなかった条件・改善提案</div>
                <div style={{paddingLeft:14}}>
                  {r.ng.length===0?<span style={{fontSize:11,color:'#94A3B8',fontStyle:'italic'}}>なし（すべての条件を達成）</span>:r.ng.map((n,i)=>(
                    <div key={i} style={{marginBottom:6,paddingBottom:6,borderBottom:i<r.ng.length-1?'1px dashed #E2E8F0':'none'}}>
                      <div style={{fontSize:11,color:'#B91C1C',fontWeight:600,marginBottom:2}}>✕ {n.cond}</div>
                      <div style={{paddingLeft:12,fontSize:10.5,color:'#475569',whiteSpace:'pre-wrap',lineHeight:1.5}}>
                        {n.detail}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ================================================================
// 勤務時間集計パネル
// ================================================================
function HoursPanel({staff,weeks,dates,asgn,manualExclusions,slots,onClose,onAutoFill}){
  const weekLabels=weeks.map((wk,i)=>{
    const first=wk[0],last=wk[wk.length-1];
    return `第${i+1}週\n${first.getMonth()+1}/${first.getDate()}〜${last.getMonth()+1}/${last.getDate()}`;
  });

  const rows=staff.map(s=>{
    const wh=parseWeeklyHours(s.notes);
    const whs=weeks.map(wk=>weekHours(s.id,wk,asgn,manualExclusions,slots));
    const total=monthHours(s.id,dates,asgn,manualExclusions,slots);
    const slots_cnt=dates.reduce((sum,d)=>{
      const dk=tdk(d),da=asgn[dk]||{},dExcl=manualExclusions[dk]||{};
      return sum+Object.entries(da).reduce((s2,[slotId,ids])=>
        s2+((ids||[]).filter(sid=>sid===s.id&&!(dExcl[slotId]||[]).includes(sid)).length),0);
    },0);
    return {s,wh,whs,total,slots_cnt};
  });

  const thS={padding:'6px 10px',border:'1px solid #CBD5E1',background:'#1E293B',color:'#fff',fontSize:11,fontWeight:600,textAlign:'center',whiteSpace:'pre-line',lineHeight:1.3};

  // セルスタイル：over=超過(赤)、warn=36h以上(黄)、under=最低未達(紫)
  const tdS=(over,warn,under,isTotal)=>({
    padding:'5px 10px',border:'1px solid #E2E8F0',fontSize:12,textAlign:'center',fontWeight:isTotal?700:400,
    background:over?'#FEF2F2':under?'#F5F3FF':warn?'#FFFBEB':isTotal?'#F8FAFC':'#fff',
    color:over?'#991B1B':under?'#6D28D9':warn?'#92400E':isTotal?'#185FA5':'#1E293B',
  });

  return(
    <div style={{background:'#fff',border:'2px solid #0F766E',borderRadius:12,marginBottom:14,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'#F0FDFA',borderBottom:'1px solid #99F6E4'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontWeight:600,fontSize:14,color:'#0F766E'}}>⏱ 勤務時間集計</span>
          <span style={{fontSize:11,color:'#0F766E',opacity:.7}}>法定上限: 1日8h・週40h</span>
          <div style={{display:'flex',gap:6,fontSize:11,flexWrap:'wrap'}}>
            <span style={{background:'#FEF2F2',color:'#991B1B',border:'1px solid #FCA5A5',borderRadius:4,padding:'1px 7px'}}>赤: 週40h超</span>
            <span style={{background:'#FFFBEB',color:'#92400E',border:'1px solid #FCD34D',borderRadius:4,padding:'1px 7px'}}>黄: 週36h以上</span>
            <span style={{background:'#F5F3FF',color:'#6D28D9',border:'1px solid #C4B5FD',borderRadius:4,padding:'1px 7px'}}>紫: 最低時間未達</span>
          </div>
        </div>
        <button onClick={onClose} style={{border:'none',background:'none',cursor:'pointer',fontSize:20,color:'#0F766E',lineHeight:1,padding:0}}>×</button>
      </div>
      {/* 不足補完ボタン */}
      {rows.some(({wh,whs})=>wh?.min>0&&whs.some(h=>h>0&&h<wh.min))&&(
        <div style={{padding:'8px 16px',background:'#F5F3FF',borderBottom:'1px solid #DDD6FE',display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:12,color:'#6D28D9',flex:1}}>
            ⚠ 最低勤務時間に達していないスタッフがいます。必要人数が不足しているコマへの自動追加で補完できます。
          </span>
          <button onClick={()=>{onAutoFill();}}
            style={{padding:'6px 14px',background:'#6D28D9',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:600,whiteSpace:'nowrap'}}>
            ⚡ 不足時間を自動補完
          </button>
        </div>
      )}

      <div style={{overflowX:'auto',padding:14}}>
        <table style={{borderCollapse:'collapse',width:'100%',minWidth:500}}>
          <thead>
            <tr>
              <th style={{...thS,textAlign:'left',minWidth:80}}>スタッフ</th>
              {weekLabels.map((l,i)=><th key={i} style={{...thS,minWidth:80}}>{l}</th>)}
              <th style={{...thS,minWidth:70,background:'#0F766E'}}>月間合計</th>
              <th style={{...thS,minWidth:55,background:'#0F766E'}}>コマ数</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(({s,wh,whs,total,slots_cnt},ri)=>{
              const trBg=ri%2===0?'#fff':'#F8FAFC';
              const minH=wh?.min||0;
              const emp=parseEmploymentType(s.notes);
              const empBadge=emp==='fulltime'
                ?<span style={{fontSize:8,background:'#185FA5',color:'#fff',borderRadius:3,padding:'0 4px',marginLeft:4}}>常勤</span>
                :emp==='parttime'
                ?<span style={{fontSize:8,background:'#64748B',color:'#fff',borderRadius:3,padding:'0 4px',marginLeft:4}}>パート</span>
                :null;
              const constraintLabel=wh&&(wh.min>0||wh.max<40)
                ?<span style={{fontSize:9,color:'#6D28D9',display:'block',marginTop:1}}>
                  {wh.min>0?`週${wh.min}h以上`:''}
                  {wh.min>0&&wh.max<40?'〜':''}
                  {wh.max<40?`${wh.max}h以内`:''}
                </span>:null;
              return(
                <tr key={s.id} style={{background:trBg}}>
                  <td style={{padding:'6px 10px',border:'1px solid #E2E8F0',fontSize:12,fontWeight:600}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <span style={{width:9,height:9,borderRadius:'50%',background:s.color,flexShrink:0}}/>
                      <span>{s.name}{empBadge}{constraintLabel}</span>
                    </div>
                  </td>
                  {whs.map((wh2,i)=>{
                    const isShortWeek=weeks[i].length<3; // 月初・月末の短い週
                    const over=!isShortWeek&&wh2>WEEKLY_LIMIT;
                    const warn=!isShortWeek&&wh2>=36&&!over;
                    const weekHasWork=weeks[i].some(d=>{
                      const dk=tdk(d),da=asgn[dk]||{},dExcl=manualExclusions[dk]||{};
                      return Object.entries(da).some(([slotId,ids])=>
                        (ids||[]).some(sid=>sid===s.id&&!(dExcl[slotId]||[]).includes(sid)));
                    });
                    const under=!isShortWeek&&weekHasWork&&minH>0&&wh2>0&&wh2<minH;
                    return(
                      <td key={i} style={tdS(over,warn,under,false)}>
                        {wh2>0?(
                          <span>
                            {wh2.toFixed(1)}h
                            {over&&<span style={{marginLeft:2,fontSize:10}}>⚠</span>}
                            {under&&<span style={{marginLeft:2,fontSize:10}} title={'最低'+minH+'h必要'}>↑</span>}
                          </span>
                        ):'—'}
                      </td>
                    );
                  })}
                  <td style={tdS(false,false,false,true)}>{total>0?total.toFixed(1)+'h':'—'}</td>
                  <td style={{...tdS(false,false,false,false),color:'#64748B'}}>{slots_cnt>0?slots_cnt+'コマ':'—'}</td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr>
              <td style={{padding:'6px 10px',border:'1px solid #E2E8F0',fontSize:11,fontWeight:700,color:'#64748B',background:'#F1F5F9'}}>合計</td>
              {weeks.map((_,i)=>{
                const tot=rows.reduce((sum,{whs})=>sum+whs[i],0);
                return <td key={i} style={{padding:'6px 10px',border:'1px solid #E2E8F0',fontSize:11,fontWeight:700,textAlign:'center',background:'#F1F5F9',color:'#1E293B'}}>{tot>0?tot.toFixed(1)+'h':'—'}</td>;
              })}
              <td style={{padding:'6px 10px',border:'1px solid #E2E8F0',fontSize:11,fontWeight:700,textAlign:'center',background:'#E0F2FE',color:'#0F766E'}}>
                {rows.reduce((sum,{total})=>sum+total,0).toFixed(1)}h
              </td>
              <td style={{padding:'6px 10px',border:'1px solid #E2E8F0',fontSize:11,fontWeight:700,textAlign:'center',background:'#F1F5F9',color:'#64748B'}}>
                {rows.reduce((sum,{slots_cnt})=>sum+slots_cnt,0)}コマ
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

// ================================================================
function AutoPanel({result,apid,staff,y,m,allSlots,weeks,slots,onApply,onClose,onJump}){
  const [at,setAt]=useState('patterns');
  const pats=result.patterns||[],gaps=result.gaps||[];
  const st=(k)=>({padding:'8px 14px',border:'none',background:'none',cursor:'pointer',fontSize:12,fontWeight:at===k?500:400,color:at===k?K.textI:K.textS,borderBottom:at===k?'2px solid '+K.textI:'2px solid transparent'});
  return(
    <div style={{background:K.bg,border:'1.5px solid '+K.textI,borderRadius:K.rlg,marginBottom:14,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:K.bgI,borderBottom:K.bdI}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontWeight:500,fontSize:14,color:K.textI}}>自動シフト作成結果</span>
          <span style={{fontSize:11,color:K.textI,opacity:.7}}>{y}年{m}月</span>
          {apid&&<span style={{fontSize:11,background:K.bg,color:K.textI,border:K.bdI,borderRadius:10,padding:'1px 8px'}}>パターン{apid} 適用中</span>}
        </div>
        <button onClick={onClose} style={{border:'none',background:'none',cursor:'pointer',fontSize:18,color:K.textI,lineHeight:1,padding:0}}>×</button>
      </div>
      <div style={{display:'flex',borderBottom:K.bd,padding:'0 16px',background:K.bg}}>
        <button onClick={()=>setAt('patterns')} style={st('patterns')}>パターン選択 ({pats.length}案)</button>
        <button onClick={()=>setAt('gaps')} style={st('gaps')}>ギャップ提案{gaps.length>0&&<span style={{marginLeft:5,fontSize:10,background:K.bgW,color:K.textW,borderRadius:10,padding:'1px 5px'}}>{gaps.length}</span>}</button>
      </div>
      <div style={{padding:14}}>
        {at==='patterns'&&(pats.length===0?<p style={{fontSize:13,color:K.textS}}>パターンを生成できませんでした。</p>:<div style={{display:'flex',gap:12,flexWrap:'wrap'}}>{pats.map(p=><PatCard key={p.id} p={p} isOn={apid===p.id} staff={staff} weeks={weeks} slots={slots} y={y} onApply={()=>onApply(p)}/>)}</div>)}
        {at==='gaps'&&(gaps.length===0?<div style={{padding:'24px 0',textAlign:'center',color:K.textS,fontSize:13}}>全コマを条件内で埋めることができました。</div>:<GapSec gaps={gaps} staff={staff} m={m} y={y} allSlots={allSlots} onJump={onJump}/>)}
      </div>
    </div>
  );
}

function PatCard({p,isOn,staff,weeks,slots,y,onApply}){
  // p.assign のキーは "MM-DD" 形式 → "YYYY-MM-DD" 形式に変換してから制約適用
  const convertedAsgn={};
  Object.entries(p.assign||{}).forEach(([mmdd,sls])=>{
    const dk=(y?y+'-':'')+mmdd;
    convertedAsgn[dk]={};
    Object.entries(sls).forEach(([slotId,ids])=>{
      convertedAsgn[dk][slotId]=Array.isArray(ids)?[...ids]:[];
    });
  });

  const enforcedAsgn=weeks&&slots?enforceHourLimits(convertedAsgn,staff,weeks,slots):convertedAsgn;

  const cnt={};staff.forEach(s=>{cnt[s.id]=0;});
  Object.values(enforcedAsgn).forEach(ds=>{Object.values(ds).forEach(ids=>{(Array.isArray(ids)?ids:[]).forEach(sid=>{cnt[sid]=(cnt[sid]||0)+1;});});});

  // AIが生成した元のコマ数も保持（差分表示用）
  const cntRaw={};staff.forEach(s=>{cntRaw[s.id]=0;});
  Object.values(p.assign||{}).forEach(ds=>{Object.values(ds).forEach(ids=>{(Array.isArray(ids)?ids:[]).forEach(sid=>{cntRaw[sid]=(cntRaw[sid]||0)+1;});});});

  const maxC=Math.max(1,...staff.map(s=>cnt[s.id]||0));
  const active=staff.filter(s=>(cnt[s.id]||0)>0||(cntRaw[s.id]||0)>0).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0));
  return(
    <div style={{flex:'1 1 175px',minWidth:175,maxWidth:255,background:isOn?K.bgI:K.bgS,border:isOn?'2px solid '+K.textI:K.bd,borderRadius:K.rlg,padding:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
        <span style={{fontWeight:500,fontSize:14,color:isOn?K.textI:K.text}}>{p.name}</span>
        {isOn&&<span style={{fontSize:10,color:K.textI,background:K.bg,border:K.bdI,borderRadius:10,padding:'1px 7px'}}>適用中</span>}
      </div>
      <p style={{fontSize:12,color:K.textS,lineHeight:1.5,marginBottom:6}}>{p.desc}</p>
      <div style={{fontSize:10,color:K.textS,marginBottom:8,padding:'3px 6px',background:K.bgT,borderRadius:4}}>
        ※ 時間制約適用後の実際のコマ数
      </div>
      <div style={{marginBottom:10}}>
        {active.slice(0,6).map(s=>{
          const reduced=cntRaw[s.id]>cnt[s.id];
          return(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:s.color,flexShrink:0}}/>
              <span style={{fontSize:11,width:32,color:K.text,flexShrink:0}}>{s.name}</span>
              <div style={{flex:1,height:5,background:K.bgT,borderRadius:3,overflow:'hidden'}}><div style={{height:'100%',background:s.color,width:Math.round((cnt[s.id]||0)/maxC*100)+'%',borderRadius:3}}/></div>
              <span style={{fontSize:11,width:'auto',textAlign:'right',flexShrink:0,color:reduced?'#D85A30':K.textS}}>
                {cnt[s.id]||0}
                {reduced&&<span style={{fontSize:9,marginLeft:2}}>({cntRaw[s.id]}→)</span>}
              </span>
            </div>
          );
        })}
        {active.length>6&&<div style={{fontSize:11,color:K.textS,marginTop:3}}>他 {active.length-6}名...</div>}
      </div>
      <button onClick={onApply} style={{width:'100%',padding:'7px',border:isOn?K.bdI:K.bd2,borderRadius:K.rmd,background:isOn?K.bgI:K.bg,color:isOn?K.textI:K.text,cursor:'pointer',fontSize:12,fontWeight:500}}>
        {isOn?'✓ 適用済み':'このパターンを適用'}
      </button>
    </div>
  );
}

function GapSec({gaps,staff,m,y,allSlots,onJump}){
  return(
    <div>
      <p style={{fontSize:12,color:K.textS,marginBottom:12,lineHeight:1.6}}>以下のコマは通常条件では担当確保が難しい状況です。日付をクリックすると該当日を確認できます。</p>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {gaps.map((gap,i)=>{
          const si=(allSlots||[]).find(s=>s.id===gap.slot_id);
          const sc=si?getSlotColor(si):{border:'#BA7517',bgLight:K.bgW,text:K.textW,bgDetail:K.bgW};
          const sl=gap.slot_label||si?.label||gap.slot_id;
          const dn=(gap.date||'').split('-').pop();
          const fdk=gap.date?y+'-'+gap.date:null;
          return(
            <div key={i} style={{background:K.bgW,border:K.bdW,borderRadius:K.rmd,padding:'10px 14px'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                {fdk?<button onClick={()=>onJump&&onJump(fdk)} style={{fontWeight:500,fontSize:13,color:K.textW,background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline',textDecorationStyle:'dotted'}}>{m}月{dn}日({gap.dow})</button>
                    :<span style={{fontWeight:500,fontSize:13,color:K.textW}}>{m}月{dn}日({gap.dow})</span>}
                <span style={{fontSize:12,borderRadius:4,padding:'1px 8px',fontWeight:500,background:sc.bgDetail,color:sc.text}}>{sl}</span>
                {si?.time&&<span style={{fontSize:11,color:K.textS}}>{si.time}</span>}
              </div>
              <p style={{fontSize:12,color:K.textS,marginBottom:8,lineHeight:1.5}}>{gap.reason}</p>
              {(gap.candidates||[]).length>0&&(
                <div>
                  <div style={{fontSize:11,fontWeight:500,color:K.textS,marginBottom:5}}>もし依頼できるとしたら:</div>
                  <div style={{display:'flex',flexDirection:'column',gap:5}}>
                    {gap.candidates.map((c,j)=>{
                      const s=staff.find(x=>x.id===c.id||x.name===c.name);
                      return(
                        <div key={j} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'7px 10px',background:K.bg,borderRadius:K.rmd,border:K.bd}}>
                          {s&&<span style={{width:8,height:8,borderRadius:'50%',background:s.color,flexShrink:0,marginTop:3}}/>}
                          <div style={{lineHeight:1.5}}><span style={{fontWeight:500,fontSize:12,color:K.text}}>{c.name}</span><span style={{fontSize:12,color:K.textS,marginLeft:8}}>{c.ask}</span></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── WeeklyDefaultCard ──
function WeeklyDefaultCard({dow,slots,weeklyReq,adjWeeklyReq}){
  const dayNames=['','月曜','火曜','水曜','木曜','金曜','土曜'];
  const isSat=dow===6;
  const sls=(slots||SLOTS)[dow]||[];
  return(
    <div style={{background:K.bgS,border:K.bd,borderRadius:K.rlg,padding:12,flex:'1 1 130px',minWidth:130}}>
      <div style={{fontWeight:500,fontSize:13,marginBottom:8,paddingBottom:6,borderBottom:K.bd,color:isSat?'#92400E':K.text}}>
        {dayNames[dow]}
      </div>
      {sls.map(slot=>(
        <div key={slot.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <div style={{flex:1,marginRight:6}}>
            <div style={{fontSize:10,color:K.textS}}>{slot.label}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
            <button onClick={()=>adjWeeklyReq(dow,slot.id,-1)} style={{...cntBtn,width:20,height:20,fontSize:13}}>-</button>
            <span style={{fontSize:14,fontWeight:500,width:24,textAlign:'center',color:K.text}}>{weeklyReq[dow]?.[slot.id]??1}</span>
            <button onClick={()=>adjWeeklyReq(dow,slot.id,1)} style={{...cntBtn,width:20,height:20,fontSize:13}}>+</button>
          </div>
        </div>
      ))}
    </div>
  );
}
