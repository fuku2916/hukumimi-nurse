// コマ色はlabel（名前）で自動判定。colorIdは無視。
function getShortageInfo(dk, slots, asgn, tmps, weeklyReq) {
  try {
    var dow = new Date(dk).getDay();
    var daySlots = (slots && slots[dow]) || [];
    var dayAsgn = (asgn && asgn[dk]) || {};
    var hasEmpty = false, hasShortage = false;
    for (var i=0; i<daySlots.length; i++) {
      var slot = daySlots[i];
      var ids = (dayAsgn[slot.id]||[]).filter(function(sid){
        var t = tmps && tmps[dk] && tmps[dk][String(sid)];
        return !t || (t.type !== 'off' && t.type !== 'paid');
      });
      var need = (weeklyReq && weeklyReq[dow] && weeklyReq[dow][slot.id]) || 0;
      if (need > 0 && ids.length < need) {
        hasShortage = true;
        if (ids.length === 0) hasEmpty = true;
      }
    }
    return hasEmpty ? 'empty' : hasShortage ? 'shortage' : 'ok';
  } catch(e) { return 'ok'; }
}

function getStaffTimeStr(sSlots, staffNotes) {
  try {
    var minS=9999, maxE=-1;
    for (var i=0; i<sSlots.length; i++) {
      var t = (sSlots[i].time||'').replace(/[－–—〜ー]/g,'-');
      var idx = t.indexOf('-');
      if (idx < 1) continue;
      var sp = t.slice(0,idx), ep = t.slice(idx+1);
      var sm = sp.match(/(\d{1,2}):(\d{2})/), em = ep.match(/(\d{1,2}):(\d{2})/);
      if (sm) { var sv=parseInt(sm[1])*60+parseInt(sm[2]); if(sv<minS) minS=sv; }
      if (em) { var ev=parseInt(em[1])*60+parseInt(em[2]); if(ev>maxE) maxE=ev; }
    }
    var fmt = function(m) { return m>=0&&m<9999 ? Math.floor(m/60)+':'+(m%60<10?'0':'')+(m%60) : ''; };
    var startStr = fmt(minS), endStr = fmt(maxE);
    var notes = staffNotes||'';
    var lm = notes.match(/(\d{1,2})(?::(\d{2}))?時?まで/);
    if (lm && notes.indexOf('以降') === -1 && notes.indexOf('から') === -1) {
      var lim = parseInt(lm[1])*60 + (lm[2]?parseInt(lm[2]):0);
      var limStr = Math.floor(lim/60)+':'+(lim%60<10?'0':'')+(lim%60);
      if (maxE > lim) endStr = endStr+'(退'+limStr+')';
    }
    return { startStr: startStr, endStr: endStr };
  } catch(e) { return { startStr:'', endStr:'' }; }
}

function getSlotColor(slot){
  const label=slot?.label||'';
  if(label.includes('夜'))  return SLOT_COLORS.pm;
  if(label.includes('昼'))  return SLOT_COLORS.noon;
  if(label.includes('午後')) return SLOT_COLORS.noon;
  return SLOT_COLORS.am; // 午前外来・午前手術・その他
}
// ラベルからcolorIdを取得（診療枠設定のプレビュー用）
function labelToColorId(label){
  if(!label)return'am';
  if(label.includes('夜'))return'pm';
  if(label.includes('昼')||label.includes('午後'))return'noon';
  return'am';
}

function tdk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWorkDates(y,m){const r=[],d=new Date(y,m-1,1);while(d.getMonth()===m-1){if(d.getDay()!==0)r.push(new Date(d));d.setDate(d.getDate()+1);}return r;}
function groupByWeek(dates){const ws=[];let w=[];for(const d of dates){if(w.length>0&&d.getDay()===1){ws.push(w);w=[];}w.push(d);}if(w.length)ws.push(w);return ws;}
const DAILY_LIMIT=8, WEEKLY_LIMIT=40;

// ── 日本の祝日計算 ──
function calcEquinox(year, isSpring){
  // 春分・秋分の日の計算式（天文台式近似）
  const x=year-1980;
  if(isSpring) return Math.floor(20.8431+0.242194*x-Math.floor(x/4));
  else         return Math.floor(23.2488+0.242194*x-Math.floor(x/4));
}
function nthWeekday(year,month,wday,n){
  const d=new Date(year,month-1,1); let c=0;
  while(d.getMonth()===month-1){if(d.getDay()===wday){c++;if(c===n)return new Date(d);}d.setDate(d.getDate()+1);}
  return null;
}
function getJapaneseHolidays(year){
  const h={};
  function add(y,mo,da,name){ const d=new Date(y,mo-1,da); if(d.getFullYear()===y) h[tdk(d)]=name; }
  function addD(d,name){ if(d) h[tdk(d)]=name; }

  add(year,1,1,'元日');
  addD(nthWeekday(year,1,1,2),'成人の日');
  add(year,2,11,'建国記念の日');
  if(year>=1989) add(year,2,23,'天皇誕生日');
  add(year,3,calcEquinox(year,true),'春分の日');
  add(year,4,29,'昭和の日');
  add(year,5,3,'憲法記念日');
  add(year,5,4,'みどりの日');
  add(year,5,5,'こどもの日');
  addD(nthWeekday(year,7,1,3),'海の日');
  add(year,8,11,'山の日');
  addD(nthWeekday(year,9,1,3),'敬老の日');
  add(year,9,calcEquinox(year,false),'秋分の日');
  addD(nthWeekday(year,10,1,2),'スポーツの日');
  add(year,11,3,'文化の日');
  add(year,11,23,'勤労感謝の日');

  // 振替休日（日曜が祝日→翌月曜、その月曜も祝日なら火曜…）
  const before={...h};
  Object.keys(before).forEach(dk=>{
    const d=new Date(dk);
    if(d.getDay()===0){
      const next=new Date(d);
      next.setDate(next.getDate()+1);
      while(h[tdk(next)]) next.setDate(next.getDate()+1);
      h[tdk(next)]='振替休日';
    }
  });

  // 国民の祝日（祝日に挟まれた平日）
  const sorted=Object.keys(h).sort();
  sorted.forEach(dk=>{
    const d=new Date(dk);
    const prev=new Date(d); prev.setDate(prev.getDate()-2);
    const next=new Date(d); next.setDate(next.getDate()+2);
    const mid=new Date(d); mid.setDate(mid.getDate()-1);
    if(h[tdk(prev)]&&h[tdk(d)]&&!h[tdk(mid)]&&mid.getDay()!==0&&mid.getDay()!==6)
      h[tdk(mid)]='国民の祝日';
  });
  return h;
}

function parseEmploymentType(notes){
  if(!notes) return null;

// ── パターン適用後に週間時間上限を超えた割当を週内均等分散で除去（グローバル）──
function enforceHourLimits(rawAsgn, staff, weeks, slots){
  const na={};
  Object.entries(rawAsgn).forEach(([dk,sm])=>{
    na[dk]={};
    Object.entries(sm).forEach(([slotId,ids])=>{na[dk][slotId]=[...(ids||[])];});
  });

  staff.forEach(s=>{
    const wh=parseWeeklyHours(s.notes);
    if(!wh||wh.max<=0) return;
    const maxH=Math.min(wh.max, WEEKLY_LIMIT);

    weeks.forEach(weekDates=>{
      const assigned=[];
      weekDates.forEach(d=>{
        const dk=tdk(d), dow=d.getDay();
        (slots[dow]||[]).forEach(slot=>{
          if((na[dk]?.[slot.id]||[]).includes(s.id)){
            assigned.push({dk, dow, slotId:slot.id, h:slotHours(dow,slot.id,slots)});
          }
        });
      });
      if(assigned.length===0) return;

      const totalH=assigned.reduce((sum,a)=>sum+a.h, 0);
      if(totalH<=maxH) return;

      // 曜日ごとにグループ化してラウンドロビン選択
      const byDay={};
      assigned.forEach(a=>{
        if(!byDay[a.dow]) byDay[a.dow]=[];
        byDay[a.dow].push(a);
      });
      const days=Object.keys(byDay).sort((a,b)=>Number(a)-Number(b));

      const kept=new Set();
      let accumulated=0;
      let changed=true;
      while(changed){
        changed=false;
        for(const dow of days){
          const notYet=byDay[dow].filter(a=>!kept.has(a.dk+'|'+a.slotId));
          if(notYet.length===0) continue;
          const next=notYet[0];
          if(accumulated+next.h<=maxH){
            kept.add(next.dk+'|'+next.slotId);
            accumulated+=next.h;
            changed=true;
          }
        }
      }

      assigned.forEach(a=>{
        if(!kept.has(a.dk+'|'+a.slotId)){
          na[a.dk][a.slotId]=(na[a.dk][a.slotId]||[]).filter(sid=>sid!==s.id);
        }
      });
    });
  });
  return na;
}
function parseWeeklyHours(notes){
  if(!notes)return null;
  // 全角→半角に正規化
  const n=notes
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[~～]/g,'〜');
  const m1=n.match(/(\d+)\s*時間以上[、,\s]*(\d+)\s*時間以内/);
  if(m1) return {min:parseInt(m1[1]),max:parseInt(m1[2])};
  const m2=n.match(/(\d+)\s*[〜~～]\s*(\d+)\s*時間/);
  if(m2) return {min:parseInt(m2[1]),max:parseInt(m2[2])};
  const m3=n.match(/(\d+)\s*時間以上/);
  if(m3) return {min:parseInt(m3[1]),max:40};
  const m4=n.match(/(\d+)\s*時間以内/);
  if(m4) return {min:0,max:parseInt(m4[1])};
  const m5=n.match(/週\s*(\d+)\s*時間/);
  if(m5) return {min:Math.round(parseInt(m5[1])*0.8),max:parseInt(m5[1])};
  return null;
}
// slotHours: slotsState(編集後)優先、なければ SLOTS マスタ参照
function slotHours(dow,slotId,slotsState){
  const src=slotsState||SLOTS;
  return (src[dow]||[]).find(s=>s.id===slotId)?.h||0;
}
function dayHours(dk,staffId,asgn,excl,slotsState){
  const d=new Date(dk),dow=d.getDay(),da=asgn[dk]||{};
  return Object.entries(da).reduce((sum,[slotId,ids])=>{
    if(!ids.includes(staffId))return sum;
    if(excl&&(excl[dk]?.[slotId]||[]).includes(staffId))return sum;
    return sum+slotHours(dow,slotId,slotsState);
  },0);
}
function weekHours(staffId,weekDates,asgn,excl,slotsState){
  return weekDates.reduce((s,d)=>s+dayHours(tdk(d),staffId,asgn,excl,slotsState),0);
}
function monthHours(staffId,dates,asgn,excl,slotsState){
  return dates.reduce((s,d)=>s+dayHours(tdk(d),staffId,asgn,excl,slotsState),0);
}
function getWeeksForDates(dates){return groupByWeek(dates);}

    return '  '+DAY_JP[dow]+'曜: '+sls.map(s=>s.label+'='+((weeklyReq||{})[dow]?.[s.id]??1)+'名').join(', ');
  }).filter(Boolean).join('\n');

  // 動的コマ定義（診療枠タブで編集された名前・時間を反映）

    return '  '+DAY_JP[dow]+': '+sls.map(s=>`${s.id}(${s.label} ${s.time})`).join(', ');
  }).filter(Boolean).join('\n');

  // ── 確定済み配置セクション（除外操作がある場合のみ生成） ──
  const hasExcl=Object.values(manualExclusions||{}).some(sm=>Object.values(sm).some(ids=>(ids||[]).length>0));
  let preserveSection='';
  if(hasExcl&&currentAsgn){
    const preserveLines=[];
    dates.forEach(d=>{
      const dk=tdk(d);
      const da=currentAsgn[dk]||{};
      const dExcl=(manualExclusions||{})[dk]||{};
      const sls=(slots||SLOTS)[d.getDay()]||[];
      sls.forEach(slot=>{
        const activeIds=(da[slot.id]||[]).filter(sid=>!(dExcl[slot.id]||[]).includes(sid));
        if(activeIds.length>0){
          const mmdd=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          const names=activeIds.map(sid=>{const s=staff.find(x=>x.id===sid);return `${s?.name||''}(ID:${sid})`;}).join('・');
          preserveLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${slot.id}: [${names}]`);
        }
      });
    });
    if(preserveLines.length>0){
      preserveSection=`━━ 確定済み配置【最優先・絶対保持】━━\n以下のスタッフは既に配置確定済みです。JSONに必ず含め、削除は絶対禁止。追加のみ可能です。\n${preserveLines.join('\n')}\n`;
    }
  }

  // 手動除外セクション
  const excLines=Object.entries(manualExclusions||{}).flatMap(([dk,slotMap])=>
    Object.entries(slotMap).flatMap(([slotId,sids])=>
      (sids||[]).map(sid=>{
        const s=staff.find(x=>x.id===sid);
        const d=new Date(dk);
        const mmdd=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        return `  ${mmdd}(${DAY_JP[d.getDay()]}) の ${slotId} に ${s?.name||'ID:'+sid}(ID:${sid}) を配置しないこと`;
      })
    )
  );
  const excSection=excLines.length>0
    ?`━━ 手動除外制約（最優先・絶対厳守）━━\n${excLines.join('\n')}\n`:'';

  // ── 臨時条件セクション ──
  const tmpLines=[];
  Object.entries(tmps||{}).forEach(([dk,staffMap])=>{
    const d=new Date(dk);
    if(d.getFullYear()!==y||d.getMonth()!==m-1)return;
    const mmdd=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    Object.entries(staffMap).forEach(([sidStr,cond])=>{
      const s=staff.find(x=>x.id===parseInt(sidStr));
      if(!s||!cond)return;
      if(cond.type==='off'){
        tmpLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${s.name}(ID:${s.id}) → 終日休み。この日は一切配置禁止。`);
      }else if(cond.type==='paid'){
        tmpLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${s.name}(ID:${s.id}) → 有給休暇（全日）。この日は一切配置禁止。`);
      }else if(cond.type==='paid_am'){
        tmpLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${s.name}(ID:${s.id}) → 有給休暇（午前）。午前のコマには配置禁止。午後コマのみ可。`);
      }else if(cond.type==='paid_pm'){
        tmpLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${s.name}(ID:${s.id}) → 有給休暇（午後）。午後のコマには配置禁止。午前コマのみ可。`);
      }else if(cond.type==='partial'&&cond.note){
        tmpLines.push(`  ${mmdd}(${DAY_JP[d.getDay()]}) ${s.name}(ID:${s.id}) → 時短: ${cond.note}。この時間を超えるコマには配置禁止。`);
      }
    });
  });
  // 出勤希望申請もtmpLinesに追加
  Object.entries(requests||{}).forEach(([dk,dayMap])=>{
    const dReq=new Date(dk);
    if(dReq.getFullYear()!==y||dReq.getMonth()+1!==m)return;
    const mmddR=`${dReq.getMonth()+1}/${dReq.getDate()}`;
    Object.entries(dayMap).forEach(([sidStr,req])=>{
      if(req.type!=='work_wish'||!req.slots)return;
      const sidR=parseInt(sidStr);
      const sR=staff.find(x=>x.id===sidR);if(!sR)return;
      const slotNames=(req.slotLabels||req.slots).join('・');
      tmpLines.push(`  ${mmddR}(${DAY_JP[dReq.getDay()]}) ${sR.name}(ID:${sR.id}) → 出勤希望: ${slotNames}。可能であればこのコマへの配置を優先してください。`);
    });
  });
  const tmpSection=tmpLines.length>0
    ?`━━ 臨時条件【最優先・絶対厳守】━━\n${tmpLines.join('\n')}\n`:'';

  // ── スタッフ条件を現在の登録内容から動的生成（時間制約を明示抽出） ──

  const staffDesc=staff.map(s=>{
    const wh=parseWeeklyHours(s.notes);
    const emp=parseEmploymentType(s.notes);
    const empLabel=emp==='fulltime'?'【常勤】':emp==='parttime'?'【パート】':'';
    // AI送信時は全角数字を半角に正規化
    const normalizedNotes=(s.notes||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
    const lines=normalizedNotes.split('\n').filter(l=>l.trim()).map(l=>`    ・${l.trim()}`).join('\n');
    let constraint='';
    if(wh&&(wh.min>0||wh.max<40)){
      if(wh.min>0&&wh.max<40){
        constraint=`\n    ★週間時間【絶対厳守】: 毎週${wh.min}h〜${wh.max}hになるよう配置すること。`
          +`\n      ${wh.min}h未満は「配置不足・違反」。必ず${wh.min}h以上になるようコマを追加せよ。`;
      } else if(wh.min>0){
        constraint=`\n    ★週間時間【絶対厳守】: 毎週最低${wh.min}h以上になるよう積極的にコマを追加すること。`;
      } else {
        constraint=`\n    ★週間時間【絶対厳守】: 毎週${wh.max}hを超えないよう配置すること。`;
      }
    }
    return `  ${empLabel}${s.name}(ID:${s.id})\n${lines}${constraint}`;
  }).join('\n');

  // 常勤・パートの分類サマリー
  const fulltimeStaff=staff.filter(s=>parseEmploymentType(s.notes)==='fulltime');
  const parttimeStaff=staff.filter(s=>parseEmploymentType(s.notes)==='parttime');
  const empSection=fulltimeStaff.length>0||parttimeStaff.length>0
    ?`━━ 雇用形態と配置優先順位━━
  常勤スタッフ（空き枠は常勤を優先して埋めること）:
${fulltimeStaff.length>0?fulltimeStaff.map(s=>`    ${s.name}(ID:${s.id})`).join('\n'):'    なし'}
  パートスタッフ（常勤で埋まらない場合に配置）:
${parttimeStaff.length>0?parttimeStaff.map(s=>`    ${s.name}(ID:${s.id})`).join('\n'):'    なし'}
  ルール: 人員不足のコマには、まず常勤スタッフを優先配置し、それでも不足する場合のみパートスタッフを配置すること。
`
    :'';

  // 休診日リストを事前計算（プロンプト用）
  const closedDates=dates.filter(d=>{
    const dk=tdk(d);
    if(manualClosedDays[dk]===false) return false;
    if(manualClosedDays[dk]===true)  return true;
    return !!holidays[dk];
  });
  const closedDks=new Set(closedDates.map(d=>tdk(d)));
  const openDates=dates.filter(d=>!closedDks.has(tdk(d)));
  const openDd=openDates.map(d=>String(m).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'('+DAY_JP[d.getDay()]+')').join(' ');
  const closedDesc=closedDates.length>0
    ?'━━ 休診日（シフト配置禁止）━━\n  '+closedDates.map(d=>{const dk=tdk(d);return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'('+DAY_JP[d.getDay()]+')'+(holidays[dk]?' '+holidays[dk]:'');}).join(' ')
    :'';
  const hourConstraints=staff
    .map(s=>({s,wh:parseWeeklyHours(s.notes)}))
    .filter(({wh})=>wh&&(wh.min>0||wh.max<40))
    .map(({s,wh})=>{
      let line=`  ${s.name}(ID:${s.id}): 週${wh.min>0?wh.min+'h以上':''}${wh.min>0&&wh.max<40?'〜':''}${wh.max<40?wh.max+'h以内':''}`;
      if(wh.min>0){
        // am_out(3.5h)のみだと何コマ必要か、am_out+pm2(7h)だと何コマか計算
        const daysNeededSingle=Math.ceil(wh.min/3.5);
        const daysNeededDouble=Math.ceil(wh.min/7.0);
        line+=`\n    → 例: am_outのみ(3.5h/日)なら最低${daysNeededSingle}コマ必要 / am_out+pm2(7h/日)なら${daysNeededDouble}日で達成`;
      }
      return line;
    })
    .join('\n');

  const prompt=
`あなたはクリニックのシフト管理AIです。${y}年${m}月のシフト表を3パターン作成してください。
${preserveSection}
${baseShiftDesc||''}
━━ 【最重要】週間労働時間の絶対制約━━
  以下のスタッフは週間労働時間に厳格な制約があります。これを満たさない配置は「失敗」です。
  必要人数の充足より優先してこの時間制約を守ってください。
${hourConstraints||'  （時間制約の設定なし）'}

  各コマの労働時間（計算用）:
    am_out=3.5h, am_surg=3.5h, pm1=2.0h, pm2=3.5h, pm_out=3.5h
    surg(月・午後手術)=3.0h, surg(水・木・金・土・午前手術)=5.5h, pm_surg=6.0h

  例: 週35h以上のスタッフが月〜金に勤務する場合、am_out(3.5h)×5日=17.5hでは不足。
    → am_out+pm2(7.0h)×5日=35.0h で条件達成。このように複数コマを組み合わせること。

━━ 労働基準法（第32条）の制約━━
  1日8時間・週40時間が上限。必ず守ること。
  1日複数コマの上限例: am_out+pm2=7.0h OK / am_out+pm1+pm2=9.0h → 違反
━━ コマ定義（曜日/slot_id/時間帯）━━
${slotDefDesc}
━━ 各コマの必要人数（目標）━━
${reqDesc}
${excSection}${tmpSection}${empSection}━━ 現在登録されているスタッフと勤務条件━━
  ※このリスト以外のスタッフは存在しません。★マークの時間制約は絶対厳守。

${staffDesc}

━━ ${y}年${m}月 勤務日（休診日を除く）━━
  ${openDd||dd}
${closedDesc}
━━ 作成手順━━
  1. ★週間時間制約のあるスタッフを確認し、毎週その時間数を達成できるコマ数・組み合わせを計算する
  2. 手術コマ担当スタッフをノートから特定し配置する
  3. 外来コマに残りのスタッフを配置し、必要人数を満たす
  4. 各週で時間制約を満たしているか必ず確認し、不足があればコマを追加する
  5. 不足コマをgapsに記録し依頼候補を提示
  6. パターンA（条件優先）・B（コマ均等）・C（夜間集約）で3案出力
━━ 3パターンの違い━━
  パターンA: 全員の制約（週間時間含む）を最大限守った配置
  パターンB: スタッフ間のコマ数をできるだけ均等に配分
  パターンC: 夜間コマ担当を特定スタッフに集中させ他の夜間負担を軽減
JSONのみで回答（前置き・コードブロック不要）:
{"patterns":[{"id":"A","name":"パターンA","desc":"...","assign":{"MM-DD":{"slot_id":[staff_id]}}}],"gaps":[{"date":"MM-DD","dow":"曜","slot_id":"...","slot_label":"...","reason":"...","candidates":[{"id":0,"name":"...","ask":"..."}]}]}`;
  const headers={'Content-Type':'application/json'};
  if(apiKey&&apiKey.trim()){headers['x-api-key']=apiKey.trim();headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true';}
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:8000,messages:[{role:'user',content:prompt}]})});
  const data=await r.json();
  if(r.status===401||r.status===403)throw new Error('AUTH_ERROR');
  if(!r.ok)throw new Error(data.error?.message||'APIエラー('+r.status+')');
  const text=(data.content||[]).find(c=>c.type==='text')?.text||'';
  const clean=text.replace(/```json|```/g,'').trim();
  try{return JSON.parse(clean);}
  catch(e){
    const fixed=clean.endsWith('}}')?clean:clean.replace(/,?\s*\{[^}]*$|,?\s*"[^"]*$|,?\s*\[.*$/,'');
    try{return JSON.parse(fixed+'}]}');}
    catch(e2){throw new Error('レスポンスのJSON解析に失敗しました。再度お試しください。（detail: '+clean.slice(0,100)+'...）');}
  }
}

function calcUsedDays(history){
  return (history||[]).reduce((s,r)=>s+(r.unit==='full'?1:0.5),0);
}
function calcRemaining(granted, history){
  return Math.max(0, (granted||0) - calcUsedDays(history));
}

function calcUsedDaysFromRequests(requests,staffId){
  let used=0;
  Object.values(requests||{}).forEach(dayMap=>{
    const req=dayMap[staffId];if(!req)return;
    if(req.type==='paid_full')used+=1;
    else if(req.type==='paid_am'||req.type==='paid_pm')used+=0.5;
  });
  return used;
}

            <button onClick={onCancel} style={{width:'100%',padding:'10px',border:'1px solid #E2E8F0',borderRadius:8,background:'#F8FAFC',color:'#64748B',cursor:'pointer',fontSize:13}}>閉じる</button>

        ):isWorkWish?(
          /* 出勤希望タイプ */

            <div style={{marginBottom:12,padding:'8px 12px',background:'#ECFDF5',borderRadius:8,border:'1px solid #6EE7B7',fontSize:12,color:'#065F46',fontWeight:600}}>🙋 出勤希望を申請します</div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,color:'#374151',fontWeight:600,marginBottom:8}}>希望するコマを選んでください（複数選択可）</div>

                {allDaySlots.map(slot=>{
                  const sc=getTimeColor(slot);
                  const isSelected=selSlots.includes(slot.id);
                  return(
                    <button key={slot.id}
                      onClick={()=>setSelSlots(prev=>isSelected?prev.filter(x=>x!==slot.id):[...prev,slot.id])}
                      style={{padding:'10px 14px',border:'2px solid '+(isSelected?sc.border:'#E2E8F0'),borderRadius:8,
                        background:isSelected?sc.bg:'#F8FAFC',color:isSelected?sc.text:'#374151',
                        cursor:'pointer',fontSize:13,fontWeight:isSelected?700:400,
                        textAlign:'left',display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontSize:16}}>{isSelected?'✓':'○'}</span>
                      <span>{slot.label}</span>
                      <span style={{fontSize:11,color:'#6B7280',marginLeft:'auto'}}>{slot.time}</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <button onClick={()=>{if(selSlots.length===0){alert('希望するコマを1つ以上選んでください');return;}onApplyWorkWish(selSlots);}}
              style={{width:'100%',padding:'13px',border:'none',borderRadius:8,background:selSlots.length>0?'#10B981':'#CBD5E1',color:'#fff',cursor:selSlots.length>0?'pointer':'not-allowed',fontSize:14,fontWeight:700,marginBottom:12}}>
              🙋 出勤希望を申請する
            </button>
            {/* 有給申請セクション（出勤希望タイプでも有給あり） */}
            <div style={{borderTop:'1px solid #E2E8F0',paddingTop:12,marginBottom:8}}>
              <div style={{fontSize:12,color:'#64748B',fontWeight:600,marginBottom:8}}>🌸 有給申請（残{remainDays}日）</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {[
                  {type:'paid_full',disabled:remainDays<1},
                  {type:'paid_am',  disabled:remainDays<0.5},
                  {type:'paid_pm',  disabled:remainDays<0.5},
                ].map(({type,disabled})=>{
                  const rt=REQ_TYPES[type];
                  return(
                    <button key={type} onClick={()=>!disabled&&onApply(type)} disabled={disabled}
                      style={{padding:'10px 14px',border:'1.5px solid '+rt.border,borderRadius:8,
                        background:disabled?'#F8FAFC':rt.bg,color:disabled?'#94A3B8':rt.color,
                        cursor:disabled?'not-allowed':'pointer',fontSize:12,fontWeight:600,
                        textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center',opacity:disabled?0.6:1}}>
                      <span>{rt.icon} {rt.label}</span>
                      <span style={{fontSize:10,fontWeight:400,opacity:0.75}}>{rt.days}日消化</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <button onClick={onCancel} style={{width:'100%',padding:'10px',border:'1px solid #E2E8F0',borderRadius:8,background:'#F8FAFC',color:'#64748B',cursor:'pointer',fontSize:13}}>キャンセル</button>
          </>
        ):(
          /* 通常タイプ：有給・希望休 */
          <>
            <div style={{marginBottom:10,padding:'8px 12px',background:'#FDF2F8',borderRadius:8,border:'1px solid #F9A8D4',fontSize:12,color:'#86198F',fontWeight:600}}>🌸 有給残日数: {remainDays}日</div>
            <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:10}}>
              {[
                {type:'paid_full',disabled:remainDays<1},
                {type:'paid_am',  disabled:remainDays<0.5},
                {type:'paid_pm',  disabled:remainDays<0.5},
                {type:'off',      disabled:false},
              ].map(({type,disabled})=>{
                const rt=REQ_TYPES[type];
                return(
                  <button key={type} onClick={()=>!disabled&&onApply(type)} disabled={disabled}
                    style={{padding:'12px 16px',border:'1.5px solid '+rt.border,borderRadius:8,
                      background:disabled?'#F8FAFC':rt.bg,color:disabled?'#94A3B8':rt.color,
                      cursor:disabled?'not-allowed':'pointer',fontSize:13,fontWeight:600,
                      textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center',opacity:disabled?0.6:1}}>
                    <span>{rt.icon} {rt.label}</span>
                    {rt.days>0&&<span style={{fontSize:11,fontWeight:400,opacity:0.75}}>{rt.days}日消化</span>}
                  </button>
                );
              })}
            </div>
            <button onClick={onCancel} style={{width:'100%',padding:'10px',border:'1px solid #E2E8F0',borderRadius:8,background:'#F8FAFC',color:'#64748B',cursor:'pointer',fontSize:13}}>キャンセル</button>
          </>
        )}
      </div>
    </div>
  );
}

// ================================================================
function App(){
  const saved=useMemo(()=>loadLS(),[]);
  // ── アプリモード ──
  const [appMode,setAppMode]=useState('select'); // 'select'|'admin'|'staff'
  const [sbLoading,setSbLoading]=useState(false);
  const [sbStatus,setSbStatus]=useState(''); // ''|'ok'|'error'

  // Supabaseからデータ読み込み（管理者モード起動時）
  React.useEffect(()=>{
    if(appMode!=='admin'||!SB_ENABLED)return;
    setSbLoading(true);
    (async()=>{
      try{
        const [sd,rd]=await Promise.all([SB.get('shift_data'),SB.get('requests_data')]);
        if(sd&&Object.keys(sd).length>0){
          if(sd.staff)setStaff(sd.staff);
          if(sd.slots)setSlots(sd.slots);
          if(sd.asgn)setAsgn(sd.asgn);
          if(sd.tmps)setTmps(sd.tmps);
          if(sd.weeklyReq)setWeeklyReq(sd.weeklyReq);
          if(sd.monthlyReq)setMonthlyReq(sd.monthlyReq);
          if(sd.manualExclusions)setManualExclusions(sd.manualExclusions);
          if(sd.manualClosedDays)setManualClosedDays(sd.manualClosedDays);
          if(sd.baseShift)setBaseShift(sd.baseShift);
          if(sd.paidLeave)setPaidLeave(sd.paidLeave);
          if(sd.newSlotCounter)setNewSlotCounter(sd.newSlotCounter);
          if(sd.y)setY(sd.y);if(sd.m)setM(sd.m);
        }
        if(rd)setRequests(rd);
        setSbStatus('ok');
      }catch(e){setSbStatus('error');}
      setSbLoading(false);
    })();
  },[appMode]);

  // Supabaseからデータ読み込み（スタッフモード起動時）
  React.useEffect(()=>{
    if(appMode!=='staff'||!SB_ENABLED)return;
    setSbLoading(true);
    (async()=>{
      try{
        const [sd,rd]=await Promise.all([SB.get('shift_data'),SB.get('requests_data')]);
        if(sd&&Object.keys(sd).length>0){
          if(sd.staff)setStaff(sd.staff);
          if(sd.slots)setSlots(sd.slots);
          if(sd.asgn)setAsgn(sd.asgn);
          if(sd.tmps)setTmps(sd.tmps);
          if(sd.manualClosedDays)setManualClosedDays(sd.manualClosedDays);
          if(sd.paidLeave)setPaidLeave(sd.paidLeave);
          if(sd.y)setY(sd.y);if(sd.m)setM(sd.m);
        }
        if(rd)setRequests(rd);
        setSbStatus('ok');
      }catch(e){setSbStatus('error');}
      setSbLoading(false);
    })();
  },[appMode]);

  // スタッフモード：requestsが変わったらSupabaseに即保存
  React.useEffect(()=>{
    if(appMode!=='staff'||!SB_ENABLED)return;
    SB.set('requests_data',requests);
  },[requests,appMode]);

  // ポーリング（スタッフモード：10秒ごとにシフト更新を確認）
  React.useEffect(()=>{
    if(appMode!=='staff'||!SB_ENABLED)return;
    const id=setInterval(async()=>{
      const sd=await SB.get('shift_data');
      if(sd&&sd.asgn){
        setAsgn(sd.asgn);
        setTmps(sd.tmps||{});
        setPaidLeave(sd.paidLeave||{});
      }
      const rd=await SB.get('requests_data');
      if(rd)setRequests(rd);
    },10000);
    return()=>clearInterval(id);
  },[appMode]);
  // ── 管理者PIN ──
  const [adminPin,setAdminPin]=useState(()=>loadAdminPin());
  const [adminPinInput,setAdminPinInput]=useState('');
  const [adminPinErr,setAdminPinErr]=useState('');
  const [showAdminPinSetting,setShowAdminPinSetting]=useState(false);
  const [openMenu,setOpenMenu]=useState(null); // 'file'|'settings'|'design'|'output'|null
  // ── スタッフモード用 state ──
  const [staffMyId,setStaffMyId]=useState(null);
  const [staffTab,setStaffTab]=useState('shift');
  const [staffReqDk,setStaffReqDk]=useState(null);
  const [pinTarget,setPinTarget]=useState(null); // {mode:'login'|'request'|'cancel', dk?, type?}
  const [staffY,setStaffY]=useState(new Date().getFullYear());
  const [staffM,setStaffM]=useState(new Date().getMonth()+1);
  // 申請データはlocalStorageから読み書き（管理者モードと共有）
  const [requests,setRequests]=useState(()=>loadRequests());
  // requestsが変わったら即保存
  React.useEffect(()=>{saveRequests(requests);},[requests]);
  // 管理者モードは申請データをポーリングで監視（3秒ごと）
  React.useEffect(()=>{
    if(appMode!=='admin')return;
    const id=setInterval(()=>{
      const latest=loadRequests();
      setRequests(prev=>{
        if(JSON.stringify(prev)===JSON.stringify(latest))return prev;
        return latest;
      });
    },3000);
    return()=>clearInterval(id);
  },[appMode]);

  // requestsが変わったらtmpsに自動反映（管理者モード）
  React.useEffect(()=>{
    if(appMode!=='admin')return;
    const typeToTmp={paid_full:'paid',paid_am:'paid_am',paid_pm:'paid_pm',off:'off'};
    const typeToUnit={paid_full:'full',paid_am:'am',paid_pm:'pm'};
    let changed=false;
    const newTmps={...tmps};
    const newPL={...paidLeave};
    const newAsgn={...asgn};
    Object.entries(requests).forEach(([dk,dayMap])=>{
      Object.entries(dayMap).forEach(([sidStr,req])=>{
        const sid=parseInt(sidStr);
        const ttype=typeToTmp[req.type];
        if(req.type==='work_wish'&&req.slots){
          // 出勤希望 → asgnにそのスタッフを追加
          req.slots.forEach(slotId=>{
            if(!newAsgn[dk])newAsgn[dk]={...(newAsgn[dk]||{})};
            const cur=newAsgn[dk][slotId]||[];
            if(!cur.includes(sid)){newAsgn[dk][slotId]=[...cur,sid];changed=true;}
          });
          return;
        }
        if(!ttype)return;
        // すでに同じ内容が反映済みならスキップ
        const existing=newTmps[dk]?.[String(sid)];
        if(existing&&existing.type===ttype)return;
        newTmps[dk]={...(newTmps[dk]||{})};
        newTmps[dk][String(sid)]={type:ttype,note:'',unit:typeToUnit[req.type]||''};
        // 有給の場合はpaidLeave履歴にも追加
        if(req.type==='paid_full'||req.type==='paid_am'||req.type==='paid_pm'){
          const cur=newPL[sid]||{granted:0,history:[]};
          const already=(cur.history||[]).some(r=>r.dk===dk&&r.unit===typeToUnit[req.type]);
          if(!already){
            const filtered=(cur.history||[]).filter(r=>r.dk!==dk);
            newPL[sid]={...cur,history:[...filtered,{dk,unit:typeToUnit[req.type],appliedAt:req.appliedAt||new Date().toISOString()}]};
          }
        }
        changed=true;
      });
    });
    if(changed){setTmps(newTmps);setPaidLeave(newPL);setAsgn(newAsgn);}
  // eslint-disable-next-line
  },[requests,appMode]);
  const [tab,setTab]=useState('shift');
  const [y,setY]=useState(()=>saved?.y||new Date().getFullYear());
  const [m,setM]=useState(()=>saved?.m||new Date().getMonth()+1);
  const [staff,setStaff]=useState(()=>saved?.staff||STAFF0);
  const [asgn,setAsgn]=useState(()=>saved?.asgn||{});
  const [tmps,setTmps]=useState(()=>saved?.tmps||{});
  const [selDk,setSelDk]=useState(null);
  const [dtab,setDtab]=useState('assign');
  const [eid,setEid]=useState(null);
  const [ef,setEf]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [addF,setAddF]=useState({name:'',notes:'',color:COLORS[0],pin:'',workType:'normal'});
  const [nid,setNid]=useState(()=>saved?.staff?Math.max(...saved.staff.map(s=>s.id),9)+1:10);
  const [aLoad,setALoad]=useState(false);
  const [aRes,setARes]=useState(null);
  const [aErr,setAErr]=useState(null);
  const [apid,setApid]=useState(null);
  const [hasManualEdits,setHasManualEdits]=useState(false);
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem('shift_api_key')||'');
  const [showKeyPanel,setShowKeyPanel]=useState(false);
  const [showHoursPanel,setShowHoursPanel]=useState(false);
  const [showReportPanel,setShowReportPanel]=useState(false);
  const [keyInput,setKeyInput]=useState('');
  const [weeklyReq,setWeeklyReq]=useState(()=>saved?.weeklyReq||WEEKLY_REQ_DEFAULT);
  const [monthlyReq,setMonthlyReq]=useState(()=>saved?.monthlyReq||{});
  const [manualExclusions,setManualExclusions]=useState(()=>saved?.manualExclusions||{});
  // 休診日管理: true=手動休診, false=手動開院（祝日でも強制開院）
  const [manualClosedDays,setManualClosedDays]=useState(()=>saved?.manualClosedDays||{});
  // ── ベースシフト（2週間ベース：Week A / Week B 交互） ──
  // 構造: { A: { 1: { am_out: [staffId,...], ... }, 2:..., ... 6 }, B: {...} }
  const [baseShift,setBaseShift]=useState(()=>saved?.baseShift||{A:{},B:{}});

  // ── 診療枠 state（編集可能） ──
  const [slots,setSlots]=useState(()=>{
    if(saved?.slots)return saved.slots;
    const s={};
    Object.entries(SLOTS).forEach(([dow,sls])=>{s[dow]=sls.map(sl=>({...sl}));});
    return s;
  });
  // 診療枠 編集 state
  const [editSlotKey,setEditSlotKey]=useState(null);
  const [editSlotF,setEditSlotF]=useState({});
  // 診療枠 追加 state
  const [newSlotCounter,setNewSlotCounter]=useState(()=>saved?.newSlotCounter||1);
  const [addSlotDow,setAddSlotDow]=useState(null);
  const [addSlotF,setAddSlotF]=useState({label:'',time:'',h:'2.0',colorId:'blue',type:'out'});

  // ── 有給管理 state ──
  const [paidLeave,setPaidLeave]=useState(()=>{
    const sv=loadLS();
    if(sv?.paidLeave) return sv.paidLeave;
    // 既存staffに対して初期値を設定
    const initStaff=sv?.staff||STAFF0;
    const init={};
    initStaff.forEach(s=>{init[s.id]={granted:0,history:[]};});
    return init;
  });

  // ── 自動保存 ──
  // ローカル自動保存
  useEffect(()=>{
    saveLS({y,m,staff,asgn,tmps,weeklyReq,monthlyReq,manualExclusions,manualClosedDays,baseShift,slots,newSlotCounter,paidLeave});
  },[y,m,staff,asgn,tmps,weeklyReq,monthlyReq,manualExclusions,manualClosedDays,baseShift,slots,newSlotCounter,paidLeave]);

  // Supabase自動保存（管理者モード・変更から2秒後）
  const sbSaveTimer=React.useRef(null);
  useEffect(()=>{
    if(appMode!=='admin'||!SB_ENABLED)return;
    if(sbSaveTimer.current)clearTimeout(sbSaveTimer.current);
    sbSaveTimer.current=setTimeout(async()=>{
      const data={y,m,staff,asgn,tmps,weeklyReq,monthlyReq,manualExclusions,manualClosedDays,baseShift,slots,newSlotCounter,paidLeave};
      await SB.set('shift_data',data);
    },2000);
  },[y,m,staff,asgn,tmps,weeklyReq,monthlyReq,manualExclusions,manualClosedDays,baseShift,slots,newSlotCounter,paidLeave,appMode]);

  // Supabase自動保存（requests）
  useEffect(()=>{
    if(!SB_ENABLED)return;
    if(sbSaveTimer.current)clearTimeout(sbSaveTimer.current);
    sbSaveTimer.current=setTimeout(async()=>{
      await SB.set('requests_data',requests);
    },1000);
  },[requests]);

  const allSlots=useMemo(()=>Object.values(slots).flat(),[slots]);
  const holidays=useMemo(()=>getJapaneseHolidays(y),[y]);

  function isClosedDay(dk){
    if(manualClosedDays[dk]===false) return false; // 手動で開院設定
    if(manualClosedDays[dk]===true)  return true;  // 手動で休診設定
    return !!holidays[dk];                          // 祝日は自動休診
  }
  function toggleClosedDay(dk){
    const cur=isClosedDay(dk);
    const isHoliday=!!holidays[dk];
    if(cur){
      // 現在休診 → 開院に変更
      if(isHoliday) setManualClosedDays(p=>({...p,[dk]:false})); // 祝日を強制開院
      else          setManualClosedDays(p=>{const n={...p};delete n[dk];return n;}); // 手動休診を解除
    } else {
      // 現在開院 → 休診に変更
      setManualClosedDays(p=>({...p,[dk]:true}));
    }
  }

  const dates=useMemo(()=>getWorkDates(y,m),[y,m]);
  const weeks=useMemo(()=>groupByWeek(dates),[dates]);

  const hasAnyAssignment=useMemo(()=>
    dates.some(d=>Object.values(asgn[tdk(d)]||{}).some(ids=>ids.length>0)),
    [asgn,dates]
  );
  const totalExclusions=useMemo(()=>
    Object.values(manualExclusions).reduce((sum,slotMap)=>
      sum+Object.values(slotMap).reduce((s2,ids)=>s2+(ids||[]).length,0),0),
    [manualExclusions]
  );
  const mcnt=useMemo(()=>{
    const c={};staff.forEach(s=>{c[s.id]=0;});
    dates.forEach(d=>{
      const dk=tdk(d);
      Object.entries(asgn[dk]||{}).forEach(([slotId,ids])=>{
        ids.forEach(sid=>{
          if(!(manualExclusions[dk]?.[slotId]||[]).includes(sid)){c[sid]=(c[sid]||0)+1;}
        });
      });
    });
    return c;
  },[asgn,dates,staff,manualExclusions]);

  function saveKey(){
    const k=keyInput.trim();
    setApiKey(k);
    if(k){localStorage.setItem('shift_api_key',k);}else{localStorage.removeItem('shift_api_key');}
    setShowKeyPanel(false);
  }

  // ── データ保存 ──
  async function saveData(){
    const data={version:2,savedAt:new Date().toISOString(),staff,slots,weeklyReq,monthlyReq,asgn,tmps,manualExclusions,manualClosedDays,baseShift,y,m,newSlotCounter,paidLeave};
    const json=JSON.stringify(data,null,2);
    const fileName='shift_data_'+y+'_'+String(m).padStart(2,'0')+'.json';
    if(window.showSaveFilePicker){
      try{
        const fh=await window.showSaveFilePicker({suggestedName:fileName,types:[{description:'JSONファイル',accept:{'application/json':['.json']}}]});
        const w=await fh.createWritable();await w.write(json);await w.close();return;
      }catch(e){if(e.name==='AbortError')return;}
    }
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;a.click();URL.revokeObjectURL(a.href);
  }

  // ── スタッフ申請ファイルの取り込み ──
  function importStaffRequests(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.type!=='staff_requests')throw new Error('スタッフ申請ファイルではありません');
        const sid=d.staffId;
        const sname=d.staffName||'不明';
        const reqs=d.requests||{};
        const reqList=Object.entries(reqs);
        if(reqList.length===0){alert(sname+'さんの申請データは空です。');return;}

        // 申請内容をtmpsとpaidLeaveに反映
        let appliedCount=0;
        const typeToTmpType={paid_full:'paid',paid_am:'paid_am',paid_pm:'paid_pm',off:'off'};
        const typeToUnit={paid_full:'full',paid_am:'am',paid_pm:'pm'};

        const newTmps={...tmps};
        const newPL={...paidLeave};

        reqList.forEach(([dk,req])=>{
          const ttype=typeToTmpType[req.type];
          if(!ttype)return;
          // tmpsに追加
          newTmps[dk]={...(newTmps[dk]||{})};
          newTmps[dk][sid]={type:ttype,note:'',unit:typeToUnit[req.type]||''};
          // 有給の場合はpaidLeave履歴にも追加
          if(req.type==='paid_full'||req.type==='paid_am'||req.type==='paid_pm'){
            const cur=newPL[sid]||{granted:0,history:[]};
            const filtered=(cur.history||[]).filter(r=>r.dk!==dk);
            const entry={dk,unit:typeToUnit[req.type],appliedAt:req.appliedAt||new Date().toISOString()};
            newPL[sid]={...cur,history:[...filtered,entry]};
          }
          appliedCount++;
        });
        setTmps(newTmps);
        setPaidLeave(newPL);
        alert('✓ '+sname+'さんの申請を'+appliedCount+'件取り込みました。\nシフト表と有給残日数に反映されています。');
      }catch(err){alert('取り込みに失敗しました：'+err.message);}
    };
    reader.readAsText(file);e.target.value='';
  }

  // ── データ読み込み ──
  function loadData(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.staff)setStaff(d.staff);
        if(d.slots)setSlots(d.slots);
        if(d.weeklyReq)setWeeklyReq(d.weeklyReq);
        if(d.monthlyReq)setMonthlyReq(d.monthlyReq);
        if(d.asgn)setAsgn(d.asgn);
        if(d.tmps)setTmps(d.tmps);
        if(d.manualExclusions)setManualExclusions(d.manualExclusions);
        if(d.manualClosedDays)setManualClosedDays(d.manualClosedDays);
        if(d.baseShift)setBaseShift(d.baseShift);
        // ── CL-2形式ベースシフトJSON（名前・ラベルベース）の変換取込 ──
        if(d.patterns&&!d.baseShift){
          const DOW_MAP={'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
          // 曜日ごとのラベル→slotId変換テーブル（slotsはグローバルのSLOTS定義を使用）
          const dowLabelToId={};
          Object.entries(SLOTS).forEach(([dow,sls])=>{
            dowLabelToId[dow]={};
            sls.forEach(sl=>{dowLabelToId[dow][sl.label]=sl.id;});
          });
          // スタッフ名→ID変換テーブル（現在のstaffから）
          const curStaff=d.staff||staff;
          const nameToId={};
          curStaff.forEach(s=>{nameToId[s.name]=s.id;});
          const converted={A:{},B:{}};
          Object.entries(d.patterns).forEach(([pat,patData])=>{
            if(!converted[pat])converted[pat]={};
            const shifts=patData.shifts||{};
            Object.entries(shifts).forEach(([dowJp,slotMap])=>{
              const dow=DOW_MAP[dowJp];if(!dow)return;
              const labelMap=dowLabelToId[dow]||{};
              if(!converted[pat][dow])converted[pat][dow]={};
              Object.entries(slotMap).forEach(([label,names])=>{
                const slotId=labelMap[label];if(!slotId)return;
                const ids=(names||[]).map(n=>nameToId[n]).filter(id=>id!==undefined);
                if(ids.length>0)converted[pat][dow][slotId]=ids;
              });
            });
          });
          setBaseShift(converted);
          alert('ベースシフトを読み込みました（CL-2形式）\nAパターン・Bパターンをベースシフトタブで確認してください。');
        }
        if(d.y)setY(d.y);if(d.m)setM(d.m);
        if(d.newSlotCounter)setNewSlotCounter(d.newSlotCounter);
        if(d.paidLeave)setPaidLeave(d.paidLeave);
        alert('データを読み込みました（保存日時: '+new Date(d.savedAt).toLocaleString('ja-JP')+'）');
      }catch(err){alert('読み込みに失敗しました。正しいJSONファイルか確認してください。');}
    };
    reader.readAsText(file);e.target.value='';
  }

    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;a.click();URL.revokeObjectURL(a.href);
  }

  // ── 達成レポート生成（機械チェック） ──
  function generateReport(){
    return staff.map(s=>{
      const wh=parseWeeklyHours(s.notes);
      const emp=parseEmploymentType(s.notes);
      const ok=[];
      const ng=[];

      try{
        // 月間総時間とコマ数
        const totalH=monthHours(s.id,dates,asgn,manualExclusions,slots);
        const totalSlots=dates.reduce((sum,d)=>{
          const dk=tdk(d),dayAsgn=asgn[dk]||{},dayExcl=manualExclusions[dk]||{};
          return sum+Object.entries(dayAsgn).reduce((s2,[slotId,ids])=>
            s2+((ids||[]).filter(sid=>sid===s.id&&!(dayExcl[slotId]||[]).includes(sid)).length),0);
        },0);

        // 週間時間制約チェック
        if(wh&&(wh.min>0||wh.max<40)){
          const condDesc='週'+(wh.min>0?wh.min+'h以上':'')+(wh.min>0&&wh.max<40?'〜':'')+(wh.max<40?wh.max+'h以内':'');
          const violations=[];
          weeks.forEach((wk,wi)=>{
            if(wk.length<3) return; // 月初・月末の短い週はスキップ
            const h=weekHours(s.id,wk,asgn,manualExclusions,slots);
            const hasWork=wk.some(d=>{
              const dk=tdk(d),dayAsgn=asgn[dk]||{};
              return Object.entries(dayAsgn).some(([slotId,ids])=>
                (ids||[]).includes(s.id)&&!(manualExclusions[dk]?.[slotId]||[]).includes(s.id));
            });
            if(!hasWork) return;
            if(wh.min>0&&h<wh.min) violations.push('第'+(wi+1)+'週: '+h.toFixed(1)+'h（'+(wh.min-h).toFixed(1)+'h不足）');
            if(wh.max<40&&h>wh.max) violations.push('第'+(wi+1)+'週: '+h.toFixed(1)+'h（'+(h-wh.max).toFixed(1)+'h超過）');
          });
          if(violations.length===0) ok.push(condDesc+'：すべての週で達成');
          else ng.push({cond:condDesc, detail:violations.join('\n')});
        }

        // 月間実績は必ず表示
        const empLabel=emp==='fulltime'?'常勤':emp==='parttime'?'パート':'スタッフ';
        ok.push((empLabel?empLabel+'として':'')+'月間 '+totalH.toFixed(1)+'h / '+totalSlots+'コマ 勤務');

        // 週コマ数制約チェック（「週1〜2コマ」「週3コマ以内」など）
        const notesN=(s.notes||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
        const slotCntMatch=notesN.match(/週\s*(\d+)\s*[〜~～]\s*(\d+)\s*コマ/) ||
                           notesN.match(/週\s*(\d+)\s*コマ以内/) ||
                           notesN.match(/週\s*(\d+)\s*コマ(?:のみ)?/);
        if(slotCntMatch){
          let minSlots=0,maxSlots=99;
          if(slotCntMatch[0].includes('〜')||slotCntMatch[0].includes('~')||slotCntMatch[0].includes('～')){
            minSlots=parseInt(slotCntMatch[1]);maxSlots=parseInt(slotCntMatch[2]);
          } else if(slotCntMatch[0].includes('以内')){
            maxSlots=parseInt(slotCntMatch[1]);
          } else {
            minSlots=parseInt(slotCntMatch[1]);maxSlots=parseInt(slotCntMatch[1]);
          }
          const slotViol=[];
          weeks.forEach((wk,wi)=>{
            if(wk.length<3) return;
            const wkSlots=wk.reduce((sum,d)=>{
              const dk=tdk(d),dayAsgn=asgn[dk]||{},dayExcl=manualExclusions[dk]||{};
              return sum+Object.entries(dayAsgn).reduce((s2,[slotId,ids])=>
                s2+((ids||[]).filter(sid=>sid===s.id&&!(dayExcl[slotId]||[]).includes(sid)).length),0);
            },0);
            if(wkSlots===0) return;
            if(wkSlots<minSlots) slotViol.push('第'+(wi+1)+'週: '+wkSlots+'コマ（'+minSlots+'コマ以上必要）');
            if(wkSlots>maxSlots) slotViol.push('第'+(wi+1)+'週: '+wkSlots+'コマ（上限'+maxSlots+'コマ超過）');
          });
          const condDescS='週'+slotCntMatch[0].replace('週','').trim();
          if(slotViol.length===0) ok.push(condDescS+'：すべての週で達成');
          else ng.push({cond:condDescS, detail:slotViol.join('\n')});
        }

        // 週間時間制約チェック（3日未満の短い週はスキップ）
        const onlySurg=/手術.*のみ|手術コマのみ|手術専門|手術専属/.test(s.notes||'');
        if(onlySurg){
          const viol=[];
          dates.forEach(d=>{
            const dk=tdk(d),dayAsgn=asgn[dk]||{},dayExcl=manualExclusions[dk]||{};
            (slots[d.getDay()]||[]).forEach(slot=>{
              if(slot.type==='surg') return;
              const ids=(dayAsgn[slot.id]||[]).filter(sid=>!(dayExcl[slot.id]||[]).includes(sid));
              if(!ids.includes(s.id)) return;
              // 代替候補
              const cands=staff.filter(o=>{
                if(o.id===s.id) return false;
                if((dayAsgn[slot.id]||[]).includes(o.id)) return false;
                const dh2=dayHours(dk,o.id,asgn,manualExclusions,slots);
                const sh2=slotHours(d.getDay(),slot.id,slots);
                return dh2+sh2<=DAILY_LIMIT;
              }).slice(0,3).map(o=>o.name).join('・');
              viol.push((d.getMonth()+1)+'/'+d.getDate()+'('+DAY_JP[d.getDay()]+') '+slot.label+(cands?' → 代替候補: '+cands:''));
            });
          });
          if(viol.length===0) ok.push('手術コマのみ担当：達成');
          else ng.push({cond:'手術コマのみ担当', detail:viol.join('\n')});
        }

        // 外来コマのみチェック
        const onlyOut=/外来.*のみ|外来コマのみ|外来専門/.test(s.notes||'');
        if(onlyOut){
          const viol=[];
          dates.forEach(d=>{
            const dk=tdk(d),dayAsgn=asgn[dk]||{},dayExcl=manualExclusions[dk]||{};
            (slots[d.getDay()]||[]).forEach(slot=>{
              if(slot.type!=='surg') return;
              const ids=(dayAsgn[slot.id]||[]).filter(sid=>!(dayExcl[slot.id]||[]).includes(sid));
              if(!ids.includes(s.id)) return;
              viol.push((d.getMonth()+1)+'/'+d.getDate()+'('+DAY_JP[d.getDay()]+') '+slot.label);
            });
          });
          if(viol.length===0) ok.push('外来コマのみ担当：達成');
          else ng.push({cond:'外来コマのみ担当', detail:viol.join('\n')});
        }

        // 曜日制限チェック
        const dowMatch=(s.notes||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).match(/([月火水木金土][・,、月火水木金土]*[月火水木金土])のみ(?:勤務)?(?:可能)?/);
        if(dowMatch){
          const dowMap={'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
          const allowedDows=new Set();
          for(const ch of dowMatch[1]) if(dowMap[ch]) allowedDows.add(dowMap[ch]);
          if(allowedDows.size>0){
            const viol=[];
            dates.forEach(d=>{
              const dow=d.getDay();
              if(allowedDows.has(dow)) return;
              const dk=tdk(d),dayAsgn=asgn[dk]||{},dayExcl=manualExclusions[dk]||{};
              (slots[dow]||[]).forEach(slot=>{
                const ids=(dayAsgn[slot.id]||[]).filter(sid=>!(dayExcl[slot.id]||[]).includes(sid));
                if(ids.includes(s.id)) viol.push((d.getMonth()+1)+'/'+d.getDate()+'('+DAY_JP[dow]+') '+slot.label);
              });
            });
            const allowedStr=[...allowedDows].sort().map(d=>['','月','火','水','木','金','土'][d]).join('・');
            if(viol.length===0) ok.push(allowedStr+'曜のみ勤務：達成');
            else ng.push({cond:allowedStr+'曜のみ勤務', detail:viol.join('\n')});
          }
        }

        // 1日8時間超チェック
        const overDays=[];
        dates.forEach(d=>{
          const dk=tdk(d);
          const dh=dayHours(dk,s.id,asgn,manualExclusions,slots);
          if(dh>DAILY_LIMIT) overDays.push((d.getMonth()+1)+'/'+d.getDate()+'('+DAY_JP[d.getDay()]+') '+dh.toFixed(1)+'h');
        });
        if(overDays.length>0) ng.push({cond:'1日8時間以内（労基法）', detail:overDays.join('、')});

        return {staff:s, totalH, totalSlots, ok, ng, employmentType:emp};
      } catch(e){
        console.error('Report error for '+s.name, e);
        return {staff:s, totalH:0, totalSlots:0, ok:[], ng:[{cond:'レポート生成でエラーが発生しました', detail:String(e?.message||e)}], employmentType:emp};
      }
    });
  }

  // ── 年の最初の月曜日からの通算週番号でA/Bパターンを判定 ──
  // 1月1日が含まれる週を起点に、通算第何週かでA/B交互
  function getABPatternForDate(d){
    const year=d.getFullYear();
    // その年の1月1日
    const jan1=new Date(year,0,1);
    // 1月1日が属する週の月曜日を起点にする
    const dayOfWeek=jan1.getDay(); // 0=日, 1=月, ..., 6=土
    const daysToMonday=dayOfWeek===0?-6:(1-dayOfWeek); // 月曜日までの日数
    const firstMon=new Date(jan1);
    firstMon.setDate(jan1.getDate()+daysToMonday);
    // d との差から通算週番号を計算
    const diffDays=Math.floor((d-firstMon)/(1000*60*60*24));
    const weekIdx=Math.floor(diffDays/7);
    return weekIdx%2===0?'A':'B';
  }

  // ── ベースシフトを月カレンダーに展開 ──
  function applyBaseShiftToMonth(){
    const newAsgn={...asgn};
    let appliedCount=0;
    dates.forEach(d=>{
      const dk=tdk(d);
      // 休診日はスキップ
      if(isClosedDay(dk)) return;
      const dow=d.getDay();
      const pattern=getABPatternForDate(d);
      const baseForDay=baseShift[pattern]?.[dow];
      if(!baseForDay) return;
      // 既存の割り当てがある日はスキップ（上書きしない）
      const hasExisting=newAsgn[dk]&&Object.values(newAsgn[dk]).some(ids=>(ids||[]).length>0);
      if(hasExisting) return;
      newAsgn[dk]={};
      Object.entries(baseForDay).forEach(([slotId,ids])=>{
        if(ids&&ids.length>0){
          // 存在するスタッフのみ
          newAsgn[dk][slotId]=ids.filter(sid=>staff.some(s=>s.id===sid));
        }
      });
      appliedCount++;
    });
    setAsgn(newAsgn);
    return appliedCount;
  }

  // ── 月切替時にベースシフトを自動展開 ──
  useEffect(()=>{
    // ベースシフトが空ならスキップ
    const hasBase=['A','B'].some(p=>Object.keys(baseShift[p]||{}).length>0);
    if(!hasBase) return;
    // 当月にすでに割り当てがあるかチェック
    const hasAsgnForMonth=dates.some(d=>{
      const dk=tdk(d);
      return asgn[dk]&&Object.values(asgn[dk]).some(ids=>(ids||[]).length>0);
    });
    if(hasAsgnForMonth) return; // 既にデータがあれば自動展開しない
    applyBaseShiftToMonth();
  // eslint-disable-next-line
  },[y,m,baseShift]);

  // ── ベースシフトの編集関数 ──
  function setBaseSlotStaff(pattern,dow,slotId,sids){
    setBaseShift(prev=>{
      const next={...prev,[pattern]:{...(prev[pattern]||{})}};
      next[pattern][dow]={...(next[pattern][dow]||{}),[slotId]:sids};
      return next;
    });
  }
  function toggleBaseSlotStaff(pattern,dow,slotId,sid){
    const cur=baseShift[pattern]?.[dow]?.[slotId]||[];
    const next=cur.includes(sid)?cur.filter(x=>x!==sid):[...cur,sid];
    setBaseSlotStaff(pattern,dow,slotId,next);
  }

  function nav(dir){
    if(dir<0){if(m===1){setY(v=>v-1);setM(12);}else setM(v=>v-1);}
    else{if(m===12){setY(v=>v+1);setM(1);}else setM(v=>v+1);}
    setSelDk(null);setARes(null);setApid(null);setAErr(null);
  }

  function tog(dk,s2,sid){
    const inAsgn=(asgn[dk]?.[s2]||[]).includes(sid);
    const isExcluded=(manualExclusions[dk]?.[s2]||[]).includes(sid);
    const hasOff=tmps[dk]?.[String(sid)]?.type==='off';

    if(inAsgn&&!isExcluded){
      // ① ON → 除外：asgnから削除 + 希望休をtmpsに設定
      setAsgn(p=>{const d2=p[dk]||{},sl=(d2[s2]||[]).filter(x=>x!==sid);return{...p,[dk]:{...d2,[s2]:sl}};});
      setTmps(p=>{const d2={...(p[dk]||{})};d2[String(sid)]={type:'off',note:''};return{...p,[dk]:d2};});
    } else if(!inAsgn&&hasOff){
      // ② 除外中（希望休）→ 復活：asgnに追加 + tmpsのoffを解除
      setAsgn(p=>{const d2=p[dk]||{},sl=d2[s2]||[];return{...p,[dk]:{...d2,[s2]:[...sl,sid]}};});
      setTmps(p=>{const d2={...(p[dk]||{})};delete d2[String(sid)];return{...p,[dk]:d2};});
    } else if(isExcluded){
      // ③ manualExclusion除外中 → 解除
      setManualExclusions(p=>{const d2=p[dk]||{},sl=(d2[s2]||[]).filter(x=>x!==sid);return{...p,[dk]:{...d2,[s2]:sl}};});
    } else {
      // ④ OFF（asgnにない）→ 追加
      setAsgn(p=>{const d2=p[dk]||{},sl=d2[s2]||[];return{...p,[dk]:{...d2,[s2]:[...sl,sid]}};});
      setTmps(p=>{const d2={...(p[dk]||{})};if(d2[String(sid)]?.type==='off')delete d2[String(sid)];return{...p,[dk]:d2};});
    }
  }

  function togExclusion(dk,slotId,sid){
    const inAsgn=(asgn[dk]?.[slotId]||[]).includes(sid);
    const isExcluded=(manualExclusions[dk]?.[slotId]||[]).includes(sid);
    const hasOff=['off','paid','paid_am','paid_pm'].includes(tmps[dk]?.[String(sid)]?.type);

    if(inAsgn&&!isExcluded){
      // ① バッジON → クリックで除外：asgnから削除 + tmpsに希望休
      setAsgn(p=>{
        const d2={...(p[dk]||{})};
        d2[slotId]=(d2[slotId]||[]).filter(x=>x!==sid);
        return{...p,[dk]:d2};
      });
      setTmps(p=>{const d2={...(p[dk]||{})};d2[String(sid)]={type:'off',note:''};return{...p,[dk]:d2};});
    } else if(!inAsgn&&hasOff){
      // ② 除外中（希望休）→ クリックで復活：asgnに追加 + tmpsのoff解除
      setAsgn(p=>{
        const d2={...(p[dk]||{})};
        const sl=d2[slotId]||[];
        if(!sl.includes(sid))d2[slotId]=[...sl,sid];
        return{...p,[dk]:d2};
      });
      setTmps(p=>{const d2={...(p[dk]||{})};delete d2[String(sid)];return{...p,[dk]:d2};});
    } else if(isExcluded){
      // ③ manualExclusion除外中 → 解除
      setManualExclusions(p=>{
        const d2=p[dk]||{},sl=(d2[slotId]||[]).filter(x=>x!==sid);
        return{...p,[dk]:{...d2,[slotId]:sl}};
      });
    }
  }

  function setTmp(dk,sid,type,note){
    setTmps(p=>{const d2={...(p[dk]||{})};if(type===null){delete d2[String(sid)];}else{d2[String(sid)]={type,note:note||''};}return{...p,[dk]:d2};});
    // off/paid（終日休）設定時 → その日の全コマからmanualExclusionsに追加してシフト表に反映
    const fullOffTypes=['off','paid'];
    if(fullOffTypes.includes(type)){
      setManualExclusions(prev=>{
        const dayAsgn=asgn[dk]||{};
        const d2={...(prev[dk]||{})};
        Object.keys(dayAsgn).forEach(slotId=>{
          const cur=d2[slotId]||[];
          if((dayAsgn[slotId]||[]).includes(sid)&&!cur.includes(sid))d2[slotId]=[...cur,sid];
        });
        return{...prev,[dk]:d2};
      });
    } else if(type===null){
      // クリア時 → manualExclusionsからも解除
      setManualExclusions(prev=>{
        const d2={...(prev[dk]||{})};
        Object.keys(d2).forEach(slotId=>{d2[slotId]=(d2[slotId]||[]).filter(x=>x!==sid);});
        return{...prev,[dk]:d2};
      });
    }
  }

  // ── 有給申請（tmpsへの反映 ＋ paidLeave履歴への記録）──
  function applyPaidLeave(dk,sid,unit){
    const typeMap={full:'paid',am:'paid_am',pm:'paid_pm'};
    const t=typeMap[unit];
    setTmps(p=>{const d2={...(p[dk]||{})};d2[String(sid)]={type:t,note:'',unit};return{...p,[dk]:d2};});
    // 全日有給の場合、全コマからmanualExclusionsに追加
    if(unit==='full'){
      setManualExclusions(prev=>{
        const dayAsgn=asgn[dk]||{};
        const d2={...(prev[dk]||{})};
        Object.keys(dayAsgn).forEach(slotId=>{
          const cur=d2[slotId]||[];
          if((dayAsgn[slotId]||[]).includes(sid)&&!cur.includes(sid))d2[slotId]=[...cur,sid];
        });
        return{...prev,[dk]:d2};
      });
    }
    setPaidLeave(prev=>{
      const cur=prev[sid]||{granted:0,history:[]};
      const filtered=(cur.history||[]).filter(r=>!(r.dk===dk&&r.unit===unit));
      const entry={dk,unit,appliedAt:new Date().toISOString()};
      return{...prev,[sid]:{...cur,history:[...filtered,entry]}};
    });
  }
  function cancelPaidLeave(dk,sid){
    setTmps(p=>{const d2={...(p[dk]||{})};delete d2[String(sid)];return{...p,[dk]:d2};});
    setPaidLeave(prev=>{
      const cur=prev[sid]||{granted:0,history:[]};
      const history=(cur.history||[]).filter(r=>r.dk!==dk);
      return{...prev,[sid]:{...cur,history}};
    });
  }
  function setPaidGranted(sid,val){
    setPaidLeave(prev=>{const cur=prev[sid]||{granted:0,history:[]};return{...prev,[sid]:{...cur,granted:Math.max(0,Number(val)||0)}};});
  }
  function doAdd(){if(!addF.name.trim())return;const newId=nid;setStaff(p=>[...p,{id:newId,name:addF.name.trim(),color:addF.color,notes:addF.notes}]);setPaidLeave(prev=>({...prev,[newId]:{granted:0,history:[]}}));setNid(n=>n+1);setAddF({name:'',notes:'',color:COLORS[nid%COLORS.length],pin:'',workType:'normal'});setShowAdd(false);}
  function sEdit(s){setEid(s.id);setEf({name:s.name,notes:s.notes,color:s.color,pin:s.pin||'',workType:s.workType||'normal'});}
  function svEdit(){setStaff(p=>p.map(s=>s.id===eid?{...s,...ef}:s));setEid(null);}

  // ── 最低勤務時間の自動補完 ──
  function autoFillHours(){
    setAsgn(prev=>{
      const next={};
      Object.entries(prev).forEach(([dk,slotMap])=>{
        next[dk]={};
        Object.entries(slotMap).forEach(([sid,ids])=>{next[dk][sid]=[...(ids||[])];});
      });

      // 常勤→パート→未設定の順で処理（常勤を優先して空き枠を埋める）
      const sortedStaff=[
        ...staff.filter(s=>parseEmploymentType(s.notes)==='fulltime'),
        ...staff.filter(s=>parseEmploymentType(s.notes)==='parttime'),
        ...staff.filter(s=>!parseEmploymentType(s.notes)),
      ];

      sortedStaff.forEach(s=>{
        const wh=parseWeeklyHours(s.notes);
        if(!wh||wh.min<=0) return;

        weeks.forEach(weekDates=>{
          let wTotal=weekHours(s.id,weekDates,next,manualExclusions,slots);
          if(wTotal>=wh.min) return;

          for(const d of weekDates){
            if(wTotal>=wh.min) break;
            const dk=tdk(d);
            const dow=d.getDay();
            const daySlots=slots[dow]||[];

            for(const slot of daySlots){
              if(wTotal>=wh.min) break;
              const curIds=next[dk]?.[slot.id]||[];
              if(curIds.includes(s.id)) continue;
              if((manualExclusions[dk]?.[slot.id]||[]).includes(s.id)) continue;
              // 必要人数に達しているコマには追加しない
              const reqCount=getReq(dk,slot.id);
              const activeCount=curIds.filter(sid=>!(manualExclusions[dk]?.[slot.id]||[]).includes(sid)).length;
              if(activeCount>=reqCount) continue;
              const dh=dayHours(dk,s.id,next,manualExclusions,slots);
              const sh=slotHours(dow,slot.id,slots);
              if(dh+sh>DAILY_LIMIT) continue;
              if(wTotal+sh>WEEKLY_LIMIT) continue;

              if(!next[dk]) next[dk]={};
              if(!next[dk][slot.id]) next[dk][slot.id]=[];
              next[dk][slot.id]=[...next[dk][slot.id],s.id];
              wTotal+=sh;
            }
          }
        });
      });
      return next;
    });
    // 常勤の最低時間達成を最優先（パートとの入れ替えも含む）
    setTimeout(()=>setAsgn(prev=>fillFulltimeMinHours(prev)),0);
    setHasManualEdits(true);
  }
  // 時間帯文字列「HH:MM-HH:MM」から労働時間(h)を計算（全角文字も許容）
  function calcHoursFromTime(timeStr){
    if(!timeStr)return null;
    // 全角→半角に正規化
    const normalized=timeStr
      .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
      .replace(/[:：]/g,':')
      .replace(/[‐ー－–—~〜～]/g,'-');
    const m=normalized.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
    if(!m)return null;
    const start=parseInt(m[1])*60+parseInt(m[2]);
    const end  =parseInt(m[3])*60+parseInt(m[4]);
    const diff=(end-start)/60;
    return diff>0?Math.round(diff*10)/10:null;
  }

  function getReq(dk,slotId){
    if(monthlyReq[dk]?.[slotId]!==undefined)return monthlyReq[dk][slotId];

  }
  function adjMonthReq(dk,slotId,delta){
    const cur=getReq(dk,slotId);
    setMonthlyReq(p=>({...p,[dk]:{...(p[dk]||{}),[slotId]:Math.max(0,cur+delta)}}));
  }

  function adjWeeklyReq(dow,slotId,delta){

    // 基本設定を変更したとき、同じ曜日・コマの月次個別調整を自動クリア（基本設定を即反映させるため）
    setMonthlyReq(prev=>{

      dates.forEach(d=>{
        if(d.getDay()===Number(dow)){
          const dk=tdk(d);
          if(next[dk]?.[slotId]!==undefined){

            delete dayAdj[slotId];
            if(Object.keys(dayAdj).length===0) delete next[dk];
            else next[dk]=dayAdj;
          }
        }

      return next;
    });
  }

  // ── 常勤スタッフの最低時間を必ず達成する（必要ならパートと入れ替え）──
  function fillFulltimeMinHours(rawAsgn){
    const na={};
    Object.entries(rawAsgn).forEach(([dk,sm])=>{
      na[dk]={};
      Object.entries(sm).forEach(([slotId,ids])=>{na[dk][slotId]=[...(ids||[])];});
    });

    const fulltimeStaff=staff.filter(s=>parseEmploymentType(s.notes)==='fulltime');

    fulltimeStaff.forEach(ft=>{
      const wh=parseWeeklyHours(ft.notes);
      if(!wh||wh.min<=0) return;
      const maxH=Math.min(wh.max||WEEKLY_LIMIT,WEEKLY_LIMIT);

      weeks.forEach(weekDates=>{
        if(weekDates.length<3) return;
        let wTotal=weekHours(ft.id,weekDates,na,{},slots);
        if(wTotal>=wh.min) return;

        // 追加可能なコマを全列挙（日数×コマ）
        const candidates=[];
        weekDates.forEach(d=>{
          const dk=tdk(d),dow=d.getDay();
          (slots[dow]||[]).forEach(slot=>{
            const curIds=na[dk]?.[slot.id]||[];
            if(curIds.includes(ft.id)) return;
            if((manualExclusions[dk]?.[slot.id]||[]).includes(ft.id)) return;
            const sh=slotHours(dow,slot.id,slots);
            if(sh<=0) return;
            // 日の合計がDAILY_LIMITを超えないか確認
            const dh=dayHours(dk,ft.id,na,{},slots);
            if(dh+sh>DAILY_LIMIT) return;
            if(wTotal+sh>maxH) return;
            const req=getReq(dk,slot.id);
            const curActive=curIds.filter(sid=>!(manualExclusions[dk]?.[slot.id]||[]).includes(sid)).length;
            // 優先度：人員不足のコマ > パートがいるコマ > その他
            const hasPart=curIds.some(sid=>{
              const s=staff.find(x=>x.id===sid);
              return s&&parseEmploymentType(s.notes)==='parttime';
            });
            const priority=curActive<req?0:hasPart?1:2;
            candidates.push({dk,dow,slot,sh,curIds,req,curActive,hasPart,priority});
          });
        });

        if(candidates.length===0) return;

        // 優先度順・同優先度は曜日でラウンドロビン
        candidates.sort((a,b)=>a.priority-b.priority||(a.dow-b.dow));

        for(const c of candidates){
          if(wTotal>=wh.min) break;
          const {dk,slot,sh,curIds,curActive,req,hasPart}=c;

          // Step1: 人員不足コマに追加（そのまま）
          if(curActive<req){
            if(!na[dk][slot.id]) na[dk][slot.id]=[];
            na[dk][slot.id]=[...na[dk][slot.id],ft.id];
            wTotal+=sh;
            continue;
          }

          // Step2: パートと入れ替え（パートの最低時間・コマ数を維持できる場合）
          if(hasPart){
            const sw=curIds.find(sid=>{
              const sv=staff.find(x=>x.id===sid);
              if(!sv||parseEmploymentType(sv.notes)!=='parttime') return false;
              // 週間時間制約チェック
              const ptWh=parseWeeklyHours(sv.notes);
              if(ptWh&&ptWh.min>0){
                const ptWeekH=weekHours(sid,weekDates,na,{},slots);
                if((ptWeekH-sh)<ptWh.min) return false;
              }
              // コマ数保護：抜くとその週が0コマになる人は除外
              const curWeekSlots=weekDates.reduce((sum,wd)=>{
                const wdk=tdk(wd),wda=na[wdk]||{},wdEx=manualExclusions[wdk]||{};
                return sum+Object.values(wda).reduce((s2,ids2)=>
                  s2+((ids2||[]).filter(id2=>id2===sid&&!Object.entries(wdEx).some(([si,ex])=>(ex||[]).includes(id2))).length),0);
              },0);
              if(curWeekSlots<=1) return false; // 最低1コマは残す
              return true;
            });
            if(sw!==undefined){
              na[dk][slot.id]=curIds.filter(sid=>sid!==sw).concat([ft.id]);
              wTotal+=sh;
              continue;
            }
          }

          // Step3: 必要人数を超えるパートがいる場合（超過分を整理、コマ数保護あり）
          if(curActive>req&&hasPart){
            const sw=curIds.find(sid=>{
              const sv=staff.find(x=>x.id===sid);
              if(!sv||parseEmploymentType(sv.notes)!=='parttime') return false;
              const curWeekSlots=weekDates.reduce((sum,wd)=>{
                const wdk=tdk(wd),wda=na[wdk]||{};
                return sum+Object.values(wda).reduce((s2,ids2)=>s2+((ids2||[]).filter(id2=>id2===sid).length),0);
              },0);
              return curWeekSlots>1; // 最低1コマは残す
            });
            if(sw!==undefined){
              na[dk][slot.id]=curIds.filter(sid=>sid!==sw).concat([ft.id]);
              wTotal+=sh;
              continue;
            }
          }

          // Step4: 最終手段 - 必要人数を超えても常勤を追加
          if(!na[dk]) na[dk]={};
          if(!na[dk][slot.id]) na[dk][slot.id]=[];
          na[dk][slot.id]=[...na[dk][slot.id],ft.id];
          wTotal+=sh;
        }
      });
    });
    return na;
  }

  // ── 週コマ数の最低保証（「週1〜2コマ」の「1」を保証）──
  function ensureMinSlots(rawAsgn){
    const na={};
    Object.entries(rawAsgn).forEach(([dk,sm])=>{
      na[dk]={};
      Object.entries(sm).forEach(([slotId,ids])=>{na[dk][slotId]=[...(ids||[])];});
    });

    // コマ数制約を持つ全スタッフを対象
    staff.forEach(s=>{
      const notesN=(s.notes||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
      const m1=notesN.match(/週\s*(\d+)\s*[〜~～]\s*(\d+)\s*コマ/);
      const m2=notesN.match(/週\s*(\d+)\s*コマ/);
      const minSlots=m1?parseInt(m1[1]):m2?parseInt(m2[1]):0;
      if(minSlots<=0) return;

      weeks.forEach(weekDates=>{
        if(weekDates.length<3) return;
        // 現在の週コマ数を計算
        let wkSlots=weekDates.reduce((sum,d)=>{
          const dk=tdk(d),da=na[dk]||{},dExcl=manualExclusions[dk]||{};
          return sum+Object.entries(da).reduce((s2,[slotId,ids])=>
            s2+((ids||[]).filter(id=>id===s.id&&!(dExcl[slotId]||[]).includes(id)).length),0);
        },0);
        if(wkSlots>=minSlots) return;

        // 不足分を追加
        for(const d of weekDates){
          if(wkSlots>=minSlots) break;
          const dk=tdk(d),dow=d.getDay();
          for(const slot of (slots[dow]||[])){
            if(wkSlots>=minSlots) break;
            const curIds=na[dk]?.[slot.id]||[];
            if(curIds.includes(s.id)) continue;
            if((manualExclusions[dk]?.[slot.id]||[]).includes(s.id)) continue;
            const dh=dayHours(dk,s.id,na,{},slots);
            const sh=slotHours(dow,slot.id,slots);
            if(dh+sh>DAILY_LIMIT) continue;
            const req=getReq(dk,slot.id);
            // 必要人数の2倍を超えるような過剰配置はしない
            if(curIds.length>=req*2) continue;
            if(!na[dk]) na[dk]={};
            if(!na[dk][slot.id]) na[dk][slot.id]=[];
            na[dk][slot.id]=[...na[dk][slot.id],s.id];
            wkSlots++;
          }
        }
      });
    });
    return na;
  }

  function applyPat(pat){
    const hasExcl=Object.values(manualExclusions).some(sm=>Object.values(sm).some(ids=>(ids||[]).length>0));

    if(hasExcl){
      const na={};
      dates.forEach(d=>{
        const dk=tdk(d);
        const da=asgn[dk]||{};
        const dExcl=manualExclusions[dk]||{};

        sls.forEach(slot=>{
          const activeIds=(da[slot.id]||[]).filter(sid=>!(dExcl[slot.id]||[]).includes(sid));
          if(activeIds.length>0){
            if(!na[dk])na[dk]={};
            na[dk][slot.id]=[...activeIds];
          }
        });
      });
      Object.entries(pat.assign||{}).forEach(([mmdd,patSlots])=>{
        const dk=y+'-'+mmdd;
        if(!na[dk])na[dk]={};
        Object.entries(patSlots).forEach(([slotId,sids])=>{
          const aiIds=(Array.isArray(sids)?sids:[]).filter(sid=>staff.some(s=>s.id===sid));
          const existing=na[dk][slotId]||[];
          const merged=[...existing];
          aiIds.forEach(sid=>{if(!merged.includes(sid))merged.push(sid);});
          na[dk][slotId]=merged;
        });
      });
      setAsgn(ensureMinSlots(fillFulltimeMinHours(enforceHourLimits(na,staff,weeks,slots))));
      setApid(pat.id);
      setManualExclusions({});
    } else {
      const na={};
      Object.entries(pat.assign||{}).forEach(([mmdd,sls])=>{
        const dk=y+'-'+mmdd;na[dk]={};
        Object.entries(sls).forEach(([s2,sids])=>{
          na[dk][s2]=(Array.isArray(sids)?sids:[]).filter(sid=>staff.some(s=>s.id===sid));
        });
      });
      setAsgn(ensureMinSlots(fillFulltimeMinHours(enforceHourLimits(na,staff,weeks,slots))));
      setApid(pat.id);
    }
  }
